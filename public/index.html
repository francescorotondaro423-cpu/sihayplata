function ExpandableNewsGrid({ noticias, isMobile }) {
  const INITIAL = 6;
  const extra   = noticias.slice(INITIAL);
  const hasMore = extra.length > 0;
  const [expanded,   setExpanded]   = React.useState(false);
  const [collapsing, setCollapsing] = React.useState(false);
  const extraRef = React.useRef(null);

  const doExpand = () => {
    const el = extraRef.current;
    if (!el) { setExpanded(true); return; }
    el.style.transition = 'none';
    el.style.overflow   = 'hidden';
    el.style.maxHeight  = '0px';
    setExpanded(true);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transition = 'max-height 520ms cubic-bezier(.22,.68,0,1.2)';
      el.style.maxHeight  = el.scrollHeight + 'px';
      setTimeout(() => { el.style.maxHeight = ''; el.style.overflow = ''; el.style.transition = ''; }, 530);
    }));
  };

  const doCollapse = () => {
    const el = extraRef.current;
    if (!el) { setExpanded(false); return; }
    const h = el.offsetHeight;
    el.style.transition = 'none';
    el.style.overflow   = 'hidden';
    el.style.maxHeight  = h + 'px';
    setCollapsing(true);
    /* Subir la misma altura que se colapsa — el botón queda quieto en pantalla */
    window.scrollBy({ top: -h, behavior: 'smooth' });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transition = 'max-height 400ms cubic-bezier(.4,0,.2,1)';
      el.style.maxHeight  = '0px';
      setTimeout(() => { setExpanded(false); setCollapsing(false); el.style.maxHeight = ''; el.style.overflow = ''; el.style.transition = ''; }, 410);
    }));
  };

  const cols = { display:'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(2,1fr)', gap:16 };
  const showExtra = expanded || collapsing;

  return (
    <>
      {/* Primeras 6 — siempre visibles */}
      <div style={cols}>
        {noticias.slice(0, INITIAL).map((n, i) => <NewsCard key={i} n={n} />)}
      </div>

      {/* Extra — colapsable */}
      {hasMore && showExtra && (
        <div ref={extraRef}>
          <div style={{ ...cols, marginTop:16 }}>
            {extra.map((n, i) => (
              <div key={i} className="slide-up" style={{ animationDelay:`${i * 0.04}s` }}>
                <NewsCard n={n} />
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Botón Ver más / Ver menos */}
      {hasMore && (
        <button
          onClick={expanded ? doCollapse : doExpand}
          style={{
            width:'100%', marginTop:14, padding:'12px 0',
            display:'flex', alignItems:'center', justifyContent:'center', gap:8,
            background:'var(--surface)', border:'1px solid var(--border)', borderRadius:4,
            cursor:'pointer', fontFamily:'inherit', fontWeight:700, fontSize:13,
            color: expanded ? 'var(--txt-2)' : '#44685c',
            transition:'background .15s, color .15s, border-color .15s',
          }}
          onMouseEnter={e => { e.currentTarget.style.background='var(--hover-bg)'; e.currentTarget.style.borderColor='#44685c'; }}
          onMouseLeave={e => { e.currentTarget.style.background='var(--surface)'; e.currentTarget.style.borderColor='var(--border)'; }}
        >
          {expanded ? (
            <>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
              Ver menos
            </>
          ) : (
            <>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              Ver {extra.length} noticias más
            </>
          )}
        </button>
      )}
    </>
  );
}

  const touchRef = React.useRef({ startX:0, active:false });

  const resetTimer = () => {
    clearInterval(timerRef.current);
    timerRef.current = setInterval(() => setCur(c => (c + 1) % n), 5500);
  };

  React.useEffect(() => {
    if (paused) { clearInterval(timerRef.current); return; }

function AdBanner({ adId, compact }) {
  const ad = ADVERTISERS[adId];
  const [hov, setHov] = React.useState(false);
  const isMob = useWindowWidth() < 768;

  React.useEffect(() => {
    if (!ad) return;
    fetch(`/api/ads/${ad.id}/impression`, { method:'POST' }).catch(() => {});
  }, [ad && ad.id]);

  if (!ad) return (
    <div style={{ width:'100%',height:compact?80:180,background:'var(--surface)',border:'1px dashed #334155',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center' }}>
      <span style={{ fontSize:11,color:'#475569',letterSpacing:'.12em',textTransform:'uppercase' }}>Publicidad</span>
    </div>
  );

  const { id, name, tag, headline, sub, cta, badge, perks, bg1, bg2, accent, accentDim, route } = ad;
  const isDark = accent === '#FFD100';
  const go = () => window.open(`/go/${route}?pos=${compact?'compact':'full'}`, '_blank', 'noopener noreferrer');

  /* ── COMPACT ── */
  if (compact) return (
    <div onClick={go} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ width:'100%',borderRadius:12,overflow:'hidden',cursor:'pointer',position:'relative',
        background:`linear-gradient(150deg,${bg1} 0%,${bg2} 100%)`,
        border:`1px solid ${accent}33`,
        boxShadow:hov?`0 10px 36px rgba(0,0,0,.5),0 0 24px ${accent}22`:`0 2px 14px rgba(0,0,0,.4)`,
        transform:hov?'translateY(-2px)':'none', transition:'box-shadow .22s,transform .18s',
      }}>
      {/* Top accent line */}
      <div style={{ height:2,background:`linear-gradient(to right,transparent,${accent},transparent)`,opacity:.7 }}/>
      {/* Glow orb */}
      <div style={{ position:'absolute',top:-30,right:-20,width:130,height:130,borderRadius:'50%',background:`radial-gradient(circle,${accent}14 0%,transparent 70%)`,pointerEvents:'none' }}/>
      <div style={{ padding:'14px 16px 16px',position:'relative',zIndex:1 }}>
        <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8 }}>
          <span style={{ fontSize:10,fontWeight:800,color:accent,letterSpacing:'.15em',textTransform:'uppercase' }}>{tag.split('·')[0].trim()}</span>
          <span style={{ fontSize:11,color:'rgba(255,255,255,.28)',letterSpacing:'.1em',textTransform:'uppercase' }}>publicidad</span>

        <div style={{ fontSize:12,color:'rgba(255,255,255,.6)',lineHeight:1.45,marginBottom:14 }}>{headline.split('\n')[0]}</div>
        <button onClick={e=>{e.stopPropagation();go();}}
          style={{ width:'100%',padding:'9px 0',background:`linear-gradient(135deg,${accent},${accent}cc)`,color:isDark?bg1:'#fff',border:'none',borderRadius:8,fontSize:12,fontWeight:800,cursor:'pointer',fontFamily:'inherit',letterSpacing:'.02em',boxShadow:`0 4px 16px ${accent}44` }}>
          {cta}
        </button>
      </div>
    </div>
  );

  /* ── FULL ── */
  const lines = headline.split('\n');
  return (
    <div onClick={go} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{ width:'100%',borderRadius:14,overflow:'hidden',cursor:'pointer',position:'relative',
        background:`linear-gradient(140deg,${bg1} 0%,${bg2} 100%)`,
        border:`1px solid ${accent}2a`,
        minHeight: isMob ? 'auto' : 230,
        display:'flex',
        flexDirection: isMob ? 'column' : 'row',
        boxShadow:hov?`0 18px 52px rgba(0,0,0,.55),0 0 44px ${accent}18`:`0 4px 22px rgba(0,0,0,.38)`,
        transform:hov?'translateY(-2px)':'none', transition:'box-shadow .25s,transform .2s',
      }}>
      {/* Decoraciones fondo */}
      <div style={{ position:'absolute',inset:0,pointerEvents:'none',overflow:'hidden' }}>
        <div style={{ position:'absolute',top:'-40%',left:'30%',width:'65%',height:'180%',background:`radial-gradient(ellipse,${accent}0c 0%,transparent 60%)` }}/>
        <div style={{ position:'absolute',top:0,left:0,right:0,height:2,background:`linear-gradient(to right,transparent 0%,${accent}88 40%,${accent} 50%,${accent}88 60%,transparent 100%)` }}/>
        {!isMob && (
          <svg style={{ position:'absolute',bottom:0,left:0,opacity:.05 }} width="180" height="90" viewBox="0 0 180 90">
            {Array.from({length:9},(_,r)=>Array.from({length:18},(_,c)=><circle key={`${r}${c}`} cx={c*10+5} cy={r*10+5} r=".9" fill="#fff"/>))}
          </svg>
        )}
      </div>

      {/* COPY — izquierda en desktop, arriba en mobile */}
      <div style={{
        flex: isMob ? '1 1 auto' : '0 0 54%',
        padding: isMob ? '22px 20px 20px' : 'clamp(22px,3vw,38px)',
        display:'flex', flexDirection:'column', justifyContent:'center',
        position:'relative', zIndex:2,
      }}>
        <div style={{ display:'flex',alignItems:'center',gap:8,marginBottom:10 }}>
          <span style={{ fontSize:11,fontWeight:800,color:accent,letterSpacing:'.14em',textTransform:'uppercase',padding:'3px 10px',background:accentDim,borderRadius:20,border:`1px solid ${accent}44` }}>{tag.split('·')[0].trim()}</span>
          <span style={{ fontSize:10,color:'rgba(255,255,255,.35)',letterSpacing:'.1em',textTransform:'uppercase' }}>publicidad</span>
        </div>
        <div style={{ fontSize:11,fontWeight:700,color:`${accent}bb`,letterSpacing:'.07em',textTransform:'uppercase',marginBottom:6 }}>{name}</div>
        <div style={{ fontSize: isMob ? 22 : 'clamp(20px,2.6vw,30px)',fontWeight:900,color:'#fff',lineHeight:1.2,letterSpacing:'-.4px',marginBottom:10 }}>
          {lines[0]}{lines[1] && <><br/><span style={{ color:accent }}>{lines[1]}</span></>}
        </div>
        <div style={{ fontSize: isMob ? 13 : 13,color:'rgba(255,255,255,.58)',lineHeight:1.55,marginBottom:14,maxWidth: isMob ? '100%' : 310 }}>{sub}</div>

        {/* Perks — en mobile mostrar máximo 3 en fila horizontal */}
        <div style={{ display:'flex',flexWrap:'wrap',gap: isMob ? 5 : 6,marginBottom:18 }}>
          {perks.slice(0, isMob ? 3 : perks.length).map(p=>(
            <span key={p} style={{ fontSize: isMob ? 11 : 10,padding:'4px 10px',background:accentDim,border:`1px solid ${accent}33`,borderRadius:20,color:'rgba(255,255,255,.75)',fontWeight:600,display:'flex',alignItems:'center',gap:4 }}>
              <span style={{ color:accent,fontWeight:900 }}>✓</span>{p}
            </span>
          ))}
        </div>

        {/* CTA — full width en mobile */}
        <div style={{ display:'flex',alignItems:'center',gap:12, flexWrap: isMob ? 'wrap' : 'nowrap' }}>
          <button onClick={e=>{e.stopPropagation();go();}}
            style={{
              flex: isMob ? '1 1 100%' : '0 0 auto',
              padding: isMob ? '14px 20px' : '12px 26px',
              minHeight: 48,
              background:`linear-gradient(135deg,${accent} 0%,${accent}cc 100%)`,
              color:isDark?bg1:'#fff',border:'none',borderRadius:10,
              fontSize: isMob ? 15 : 13,fontWeight:800,cursor:'pointer',fontFamily:'inherit',
              letterSpacing:'.02em',boxShadow:`0 6px 22px ${accent}44`,
              transition:'opacity .15s,transform .1s',
            }}
            onMouseEnter={e=>e.currentTarget.style.opacity='.87'}
            onMouseLeave={e=>e.currentTarget.style.opacity='1'}
            onMouseDown={e=>e.currentTarget.style.transform='scale(.97)'}
            onMouseUp={e=>e.currentTarget.style.transform='scale(1)'}
          >{cta} →</button>
          {badge && <span style={{ fontSize:11,color:'rgba(255,255,255,.5)',fontWeight:600 }}><span style={{ color:accent }}>★</span> {badge}</span>}
        </div>
      </div>

      {/* VISUAL — derecha en desktop, oculto en mobile */}
      {!isMob && (
        <div style={{ flex:'0 0 46%',position:'relative',zIndex:2,overflow:'hidden' }}>
          {brandVisual(ad)}
        </div>
      )}
    </div>
  );
}

  const tdStyle = { fontSize:13, fontWeight:500, color:'var(--txt-1)', padding:'9px 12px', textAlign:'right', borderBottom:'1px solid var(--border-lt)', transition:'background .12s' };

  const Table = ({ rows, labelCol }) => (
    <table style={{ width:'100%', borderCollapse:'collapse' }}>
      <thead>
        <tr>
          <th style={thLabelStyle}>{labelCol}</th>
          <th style={thStyle}>Compra</th>

      </thead>
      <tbody>
        {rows.map(({ label, d, navKey }) => {

function NewsEditorialSection({ noticias, noticiasLoad, dolares, onNavDolar }) {
  const ww = useWindowWidth();
  const isMob = ww < 600;
  const isTab = ww >= 600 && ww < 960;

  const realItems = noticias && noticias.length > 0 ? noticias : [];
  const loading   = noticiasLoad && realItems.length === 0;
  const isMock    = !loading && realItems.length === 0;
  const items     = isMock ? MOCK_NEWS_EDITORIAL : realItems;
  const get       = i => items[i] || null;

  const colsHero    = isMob ? '1fr' : isTab ? '1fr' : '2fr 1fr';
  const colsHeroRev = isMob ? '1fr' : isTab ? '1fr' : '1fr 2fr';
  const colsPair    = isMob ? '1fr' : '1fr 1fr';
  const rowsStack   = isMob ? 'auto auto' : '1fr 1fr';

  /* Renderiza un bloque de 5 noticias: 1 large + 2 medium apiladas + 2 small */
  const Block = ({ offset, flip }) => {
    const heroGrid = flip ? colsHeroRev : colsHero;
    const large    = get(offset);
    const med1     = get(offset + 1);
    const med2     = get(offset + 2);
    const sm1      = get(offset + 3);
    const sm2      = get(offset + 4);
    if (!large && !med1) return null;
    return (
      <div style={{ marginBottom:16 }}>
        <div style={{ display:'grid', gridTemplateColumns:heroGrid, gap:16, marginBottom:14 }}>
          {flip ? (
            <>
              <div style={{ display:'grid', gridTemplateRows:rowsStack, gap:16 }}>
                {med1 && <NewsCardMedium item={med1} />}
                {med2 && <NewsCardMedium item={med2} />}
              </div>
              {large && <NewsCardLarge item={large} />}
            </>
          ) : (
            <>
              {large && <NewsCardLarge item={large} />}
              <div style={{ display:'grid', gridTemplateRows:rowsStack, gap:16 }}>
                {med1 && <NewsCardMedium item={med1} />}
                {med2 && <NewsCardMedium item={med2} />}
              </div>
            </>
          )}
        </div>
        {(sm1 || sm2) && (
          <div style={{ display:'grid', gridTemplateColumns:colsPair, gap:12 }}>
            {sm1 && <NewsCardSmall item={sm1} />}
            {sm2 && <NewsCardSmall item={sm2} />}
          </div>
        )}
      </div>
    );
  };

  const SkeletonBlock = () => (
    <div style={{ marginBottom:16 }}>
      <div style={{ display:'grid', gridTemplateColumns:colsHero, gap:16, marginBottom:14 }}>
        <NewsCardSkeleton variant="large" />
        <div style={{ display:'grid', gridTemplateRows:rowsStack, gap:16 }}>
          <NewsCardSkeleton variant="medium" />
          <NewsCardSkeleton variant="medium" />
        </div>
      </div>
      <div style={{ display:'grid', gridTemplateColumns:colsPair, gap:12 }}>
        <NewsCardSkeleton variant="small" />
        <NewsCardSkeleton variant="small" />
      </div>
    </div>
  );

  const AdRow = ({ adId }) => (
    <div style={{ margin:'32px 0' }}>
      <AdBanner adId={adId} />
    </div>
  );

  return (
    <section
      aria-label="Más información para ahorrar e invertir"
      style={{ background:'var(--bg)', paddingTop:52, paddingBottom: isMob ? 'calc(80px + env(safe-area-inset-bottom, 0px))' : 12 }}
    >
      <div style={{ maxWidth:1300, margin:'0 auto', padding:'0 20px' }}>

        {/* Cabecera editorial */}
        <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:32, flexWrap:'wrap', gap:14 }}>
          <div>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:6 }}>
              <div style={{ width:4, height:28, background:'#44685c', borderRadius:2, flexShrink:0 }} />
              <h2 style={{ fontSize: isMob ? 18 : 24, fontWeight:900, color:'var(--txt-1)', margin:0, letterSpacing:'-.4px', lineHeight:1.15 }}>
                Más información para ahorrar e invertir
              </h2>
            </div>
            <p style={{ fontSize:12, color:'var(--txt-3)', margin:'0 0 0 14px' }}>
              Economía · Mercados · Inversiones · actualización automática
            </p>
          </div>
        </div>

        {/* ══════════════════════════════════
            BLOQUE A — ítems 0-4  (5 noticias)
        ══════════════════════════════════ */}
        {loading ? <SkeletonBlock /> : <Block offset={0} flip={false} />}

        {/* PUBLICIDAD 970×250 */}
        <AdRow adId="cocos" />

        {/* ══════════════════════════════════
            BLOQUE B — ítems 5-9  (5 noticias)
        ══════════════════════════════════ */}
        {!loading && items.length >= 6 && <Block offset={5} flip={true} />}

        {/* COTIZACIONES — entre Bloque B y publicidad */}
        {!loading && <CotizacionesWidget dolares={dolares || {}} onNavDolar={onNavDolar} />}

        {!loading && items.length >= 6 && <AdRow adId="balanz" />}

        {/* ══════════════════════════════════
            BLOQUE C — ítems 10-14 (5 noticias)
        ══════════════════════════════════ */}
        {!loading && items.length >= 11 && <Block offset={10} flip={false} />}

        {!loading && items.length >= 11 && <AdRow adId="iol" />}

        {/* ══════════════════════════════════
            BLOQUE D — ítems 15-19 (5 noticias)
        ══════════════════════════════════ */}
        {!loading && items.length >= 16 && <Block offset={15} flip={true} />}

        {!loading && items.length >= 21 && <AdRow adId="lemon" />}

        {/* ══════════════════════════════════
            BLOQUE E — ítems 20-24 (5 noticias)
        ══════════════════════════════════ */}
        {!loading && items.length >= 21 && <Block offset={20} flip={false} />}

        {!loading && items.length >= 26 && <AdRow adId="belo" />}

        {/* ══════════════════════════════════
            BLOQUE F — ítems 25-29 (5 noticias)
        ══════════════════════════════════ */}
        {!loading && items.length >= 26 && <Block offset={25} flip={true} />}

        {/* Nota de fuente */}
        <div style={{ marginTop:28, paddingTop:14, borderTop:'1px solid var(--border-lt)', display:'flex', alignItems:'center', gap:8 }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--txt-3)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/>
          </svg>
          <p style={{ fontSize:11, color:'var(--txt-3)', margin:0 }}>
            {isMock
              ? 'Contenido de ejemplo · Las noticias reales cargan automáticamente desde La Nación Economía.'
              : 'Contenido extraído de lanacion.com.ar/economia · Se actualiza cada 6 horas.'
            }
          </p>
        </div>

      </div>
    </section>
  );
}

                          background:'none', border:'none',
                          borderBottom:`2px solid ${on ? '#44685c' : 'transparent'}`,
                          marginBottom:-1, color: on ? '#44685c' : 'var(--txt-2)',
                          whiteSpace:'nowrap', transition:'color .15s',
                          display:'flex', alignItems:'center', gap:6,
                        }}
                          onMouseEnter={e => { if(!on) e.currentTarget.style.color='var(--txt-1)'; }}
                          onMouseLeave={e => { if(!on) e.currentTarget.style.color='var(--txt-2)'; }}
                        >
                          {c.label}
                          {cnt !== null && (
                            <span style={{ fontSize:11, fontWeight:600, padding:'1px 7px', borderRadius:10, background: on ? '#44685c22' : 'var(--surface-2)', color: on ? '#44685c' : 'var(--txt-3)' }}>
                              {cnt}
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {/* Loading */}
                  {promotionsLoading && (
                    <div style={{ display:'flex', justifyContent:'center', padding:'40px 0', gap:6 }}>
                      {[0,1,2].map(i => <div key={i} style={{ width:7, height:7, borderRadius:'50%', background:'#44685c', animation:`blink 1.2s ease-in-out ${i*.2}s infinite` }} />)}
                    </div>
                  )}

                  {/* ── Helper: render de una promotion card ── */}
                  {(() => {
                    const PromoCard = ({ item }) => {
                      const trust = TRUST[item.verificationLevel] || TRUST.SCRAPING_VERIFIED;
                      const pct   = item.discountPercent || item.cashbackPercent || 0;
                      const acc   = item.activeToday ? '#16a34a' : pct>=30?'#16a34a':pct>=20?'#44685c':pct>=10?'#1d4ed8':'#b45309';
                      const btm   = BENEFIT_TYPE_META[item.benefitType] || BENEFIT_TYPE_META.DISCOUNT;
                      const pm    = PAYMENT_META[item.paymentMethod] || { label:item.paymentMethod, bg:'#f1f5f9', tx:'#475569', bd:'#e2e8f0' };
                      const allDays = !item.validDays || item.validDays.length===7;
                      const isToday = allDays || item.validDays?.includes(TODAY);
                      const fmtDate = s => { if(!s) return '—'; const[y,m,d]=s.split('-'); return `${d}/${m}/${y.slice(2)}`; };
                      return (
                        <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:4, overflow:'hidden', borderLeft:`4px solid ${acc}`, transition:'box-shadow .15s' }}
                          onMouseEnter={e => e.currentTarget.style.boxShadow='0 4px 18px var(--shadow-md)'}
                          onMouseLeave={e => e.currentTarget.style.boxShadow='none'}
                        >
                          <div style={{ padding:'10px 14px 6px', display:'flex', alignItems:'flex-start', gap:10 }}>
                            <div style={{ flex:1, minWidth:0 }}>
                              <div style={{ fontSize:12, fontWeight:700, color:'var(--txt-1)' }}>{item.supermarket}</div>
                              <div style={{ fontSize:10, color:'var(--txt-3)', marginTop:1 }}>{(item.supermarketList||[]).slice(0,3).join(' · ')}</div>
                            </div>
                            <div style={{ display:'flex', flexDirection:'column', gap:3, alignItems:'flex-end', flexShrink:0 }}>
                              <TrustBadge level={item.verificationLevel} />
                            </div>
                          </div>
                          <div style={{ padding:'4px 14px 8px', display:'flex', alignItems:'center', gap:10 }}>
                            <div style={{ flexShrink:0 }}>
                              <div style={{ fontSize:30, fontWeight:900, color:acc, lineHeight:1, letterSpacing:'-1px' }}>{pct>0?`${pct}%`:'Var.'}</div>
                              <div style={{ fontSize:11, fontWeight:700, color:'var(--txt-3)', textTransform:'uppercase', letterSpacing:'.07em', marginTop:2 }}>{btm.label}</div>
                            </div>
                            <div style={{ flex:1 }}>
                              <div style={{ display:'flex', flexWrap:'wrap', gap:3, marginBottom:4 }}>
                                {isToday && !allDays && <span style={{ fontSize:11, fontWeight:800, padding:'2px 6px', borderRadius:4, background:'#dcfce7', color:'#16a34a', border:'1px solid #86efac' }}>Hoy</span>}
                                {allDays ? <span style={{ fontSize:11, padding:'2px 6px', borderRadius:4, background:'var(--surface-2)', color:'var(--txt-2)', border:'1px solid var(--border)', fontWeight:600 }}>Todos los días</span>
                                  : item.validDays?.map(d=><span key={d} style={{ fontSize:11, padding:'2px 6px', borderRadius:4, background:d===TODAY?'#16a34a':'var(--surface-2)', color:d===TODAY?'#fff':'var(--txt-2)', border:`1px solid ${d===TODAY?'#16a34a':'var(--border)'}`, fontWeight:600 }}>{DIA_ABR[d]}</span>)}
                              </div>
                              <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
                                <span style={{ fontSize:11, fontWeight:700, padding:'2px 7px', borderRadius:4, background:pm.bg, color:pm.tx, border:`1px solid ${pm.bd}` }}>{pm.label}</span>
                                {item.capAmount && <span style={{ fontSize:11, padding:'2px 6px', borderRadius:4, background:'var(--surface-2)', color:'var(--txt-2)', border:'1px solid var(--border)' }}>Tope ${item.capAmount.toLocaleString('es-AR')}</span>}
                                <span style={{ fontSize:11, padding:'2px 6px', borderRadius:4, background:'var(--surface-2)', color:'var(--txt-3)', border:'1px solid var(--border)' }}>hasta {fmtDate(item.endDate)}</span>
                              </div>
                            </div>
                          </div>
                          <div style={{ padding:'6px 14px', background:'var(--surface-2)', borderTop:'1px solid var(--border-lt)', fontSize:10, color:'var(--txt-2)', lineHeight:1.5 }}>{item.description}</div>
                          <div style={{ padding:'5px 14px 7px', borderTop:'1px solid var(--border-lt)' }}>
                            <div style={{ display:'flex', alignItems:'center', gap:6, minWidth:0, marginBottom:5 }}>
                              <a href={item.sourceUrl} target="_blank" rel="noopener noreferrer"
                                style={{ fontSize:11, color:'#44685c', textDecoration:'none', flex:1, minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', display:'block' }}
                              >{item.sourceUrl}</a>
                              <span style={{ fontSize:11, color:'var(--txt-3)', flexShrink:0, whiteSpace:'nowrap' }}>
                                {item.lastValidation ? new Date(item.lastValidation).toLocaleDateString('es-AR') : '—'}
                              </span>
                            </div>
                            <div style={{ display:'flex', gap:4, justifyContent:'flex-end' }}>
                              <button onClick={() => setVerifyModal(item)} style={{ fontSize:11, fontWeight:700, padding:'3px 8px', borderRadius:4, border:`1px solid ${trust.color}`, background:'none', color:trust.color, cursor:'pointer', fontFamily:'inherit', whiteSpace:'nowrap' }}
                                onMouseEnter={e => { e.currentTarget.style.background=trust.bg; }}
                                onMouseLeave={e => { e.currentTarget.style.background='none'; }}
                              >¿Cómo verificamos?</button>
                              {!promotionsReported[item.id] ? (
                                <button onClick={() => handleReportPromotion(item.id)} style={{ fontSize:11, color:'var(--txt-3)', background:'none', border:'1px solid var(--border)', borderRadius:4, padding:'3px 7px', cursor:'pointer', fontFamily:'inherit', transition:'color .12s, border-color .12s' }}
                                  onMouseEnter={e => { e.currentTarget.style.color='#b45309'; e.currentTarget.style.borderColor='#b45309'; }}
                                  onMouseLeave={e => { e.currentTarget.style.color='var(--txt-3)'; e.currentTarget.style.borderColor='var(--border)'; }}
                                >Reportar</button>
                              ) : <span style={{ fontSize:11, color:'#16a34a', fontWeight:600 }}>Reportado</span>}
                            </div>
                          </div>
                        </div>
                      );
                    };

                    /* ── Vista "Todos" → grid plano de promos ── */
                    if (promotionsCategory === 'all') {
                      return !promotionsLoading && catItems.length > 0 ? (
                        <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'repeat(2,1fr)', gap:14, marginBottom:20 }}>
                          {catItems.map(item => <PromoCard key={item.id} item={item} />)}
                        </div>
                      ) : !promotionsLoading && promotionsItems ? (
                        <div style={{ textAlign:'center', padding:'40px 0', color:'var(--txt-3)', fontSize:13 }}>Sin resultados.</div>
                      ) : null;
                    }

                    /* ── Vista por categoría → directorio completo de billeteras ── */
                    const dirWallets = WALLET_DIR[promotionsCategory] || [];
                    const filteredDir = promotionsSearch.trim()
                      ? dirWallets.filter(w => normStr(w.name).includes(normQ) ||
                          allItems.filter(i=>i.wallet===w.key).some(i=>
                            [i.wallet, i.supermarket,...(i.supermarketList||[]),i.description].some(s=>normStr(s).includes(normQ))
                          ))
                      : dirWallets;

                    const catColor = CATS.find(c=>c.key===promotionsCategory)?.color || '#44685c';

                    return !promotionsLoading ? (
                      <div style={{ marginBottom:20 }}>
                        <div style={{ fontSize:11, color:'var(--txt-3)', marginBottom:14 }}>
                          {dirWallets.length} fuentes mapeadas en esta categoría
                          {promotionsItems && ` · ${allItems.filter(i=>i.sourceCategory===promotionsCategory).length} con promociones activas verificadas`}
                        </div>
                        {filteredDir.map(wallet => {
                          const wPromos = allItems.filter(i => i.wallet === wallet.key);
                          const hasPromos = wPromos.length > 0;
                          return (
                            <div key={wallet.key} style={{
                              background:'var(--surface)', border:'1px solid var(--border)',
                              borderRadius:4, marginBottom:12, overflow:'hidden',
                              borderLeft: hasPromos ? `4px solid ${catColor}` : '4px solid var(--border)',
                            }}>
                              {/* Wallet header */}
                              <div style={{ padding:'12px 16px', display:'flex', alignItems:'center', gap:12 }}>
                                <div style={{
                                  width:40, height:40, borderRadius:8, flexShrink:0,
                                  background:wallet.bg, display:'flex', alignItems:'center', justifyContent:'center',
                                  fontSize:12, fontWeight:900, color:wallet.fg, letterSpacing:'-.5px',
                                  boxShadow:'0 2px 6px rgba(0,0,0,.2)',
                                }}>{wallet.abbr}</div>
                                <div style={{ flex:1, minWidth:0 }}>
                                  <div style={{ fontWeight:800, fontSize:14, color:'var(--txt-1)', lineHeight:1.2 }}>{wallet.name}</div>
                                  <a href={wallet.url} target="_blank" rel="noopener noreferrer" style={{ fontSize:10, color:'#44685c', textDecoration:'none' }}>{wallet.url}</a>
                                </div>
                                <div style={{ flexShrink:0 }}>
                                  {hasPromos ? (
                                    <span style={{ fontSize:11, fontWeight:800, padding:'3px 9px', borderRadius:4, background:'#dcfce7', color:'#16a34a', border:'1px solid #86efac' }}>
                                      {wPromos.length} promo{wPromos.length!==1?'s':''}
                                    </span>
                                  ) : (
                                    <span style={{ fontSize:11, fontWeight:600, padding:'3px 9px', borderRadius:4, background:'var(--surface-2)', color:'var(--txt-3)', border:'1px solid var(--border)' }}>
                                      Sin datos
                                    </span>
                                  )}
                                </div>
                              </div>

                              {/* Promos or empty state */}
                              {hasPromos ? (
                                <div style={{ padding:'0 16px 14px', display:'grid', gridTemplateColumns: (!isMobile && wPromos.length > 1) ? 'repeat(2,1fr)' : '1fr', gap:10 }}>
                                  {wPromos.map(item => <PromoCard key={item.id} item={item} />)}
                                </div>
                              ) : (
                                <div style={{ padding:'10px 16px 14px', borderTop:'1px solid var(--border-lt)', background:'var(--surface-2)' }}>
                                  <div style={{ fontSize:11, color:'var(--txt-3)', lineHeight:1.6 }}>
                                    Sin promociones verificadas disponibles actualmente para supermercados.
                                    <a href={wallet.url} target="_blank" rel="noopener noreferrer" style={{ color:'#44685c', marginLeft:4, textDecoration:'none' }}>Ver beneficios en la app oficial →</a>
                                  </div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                        {filteredDir.length === 0 && (
                          <div style={{ textAlign:'center', padding:'32px 0', color:'var(--txt-3)', fontSize:13 }}>Sin resultados para "{promotionsSearch}"</div>
                        )}
                      </div>
                    ) : null;
                  })()}

                  {/* Leyenda de niveles de confianza */}
                  {promotionsItems && (
                    <div style={{ padding:'14px 16px', background:'var(--surface-3)', border:'1px solid var(--border-lt)', borderRadius:4 }}>
                      <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-2)', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:10 }}>Niveles de confianza</div>
                      <div style={{ display:'flex', flexWrap:'wrap', gap:10 }}>
                        {Object.entries(TRUST).map(([k,t]) => (
                          <div key={k} style={{ display:'flex', alignItems:'center', gap:6 }}>
                            <span style={{ width:7, height:7, borderRadius:'50%', background:t.dot, flexShrink:0 }}/>
                            <span style={{ fontSize:10, color:'var(--txt-2)', fontWeight:600 }}>{t.label}</span>
                          </div>
                        ))}
                      </div>
                      <div style={{ fontSize:10, color:'var(--txt-3)', marginTop:8, lineHeight:1.6 }}>
                        Toda promoción visible tiene <strong style={{ color:'var(--txt-2)' }}>fuente oficial, URL de respaldo y fecha de validación</strong>.
                        Las promociones sin estos datos no se publican. Sync automático cada 12 hs.
                        {` Actualmente: ${allItems.length} promociones activas.`}
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}

            {/* ══════════════════════════════════════════
                SECCIÓN TRANSPORTE
            ══════════════════════════════════════════ */}
            {activeTab === 'combustibles' && (() => {
              /* ═══ COMBUSTIBLES ═══════════════════════════════════════ */
              const FUEL_CATS = [
                { key:'all',      label:'Todas',    color:'#44685c' },
                { key:'ypf',      label:'YPF',      color:'#003da5' },
                { key:'shell',    label:'Shell',    color:'#dd1d21' },
                { key:'axion',    label:'Axion',    color:'#cc1e2a' },
                { key:'puma',     label:'Puma',     color:'#e5810f' },
                { key:'gulf',     label:'Gulf',     color:'#c07a10' },
                { key:'bancos',   label:'Bancos',   color:'#1d4ed8' },
                { key:'billeteras',label:'Billeteras',color:'#7c3aed'},
                { key:'puntos',   label:'Puntos',   color:'#0f766e' },
              ];
              const FUEL_STATIONS = {
                ypf:   { label:'YPF',        color:'#003da5', bg:'#e8eeff', abbr:'YPF', logoColor:'linear-gradient(135deg,#003da5,#1d4ed8)' },
                shell: { label:'Shell',      color:'#dd1d21', bg:'#ffebe8', abbr:'SHE', logoColor:'linear-gradient(135deg,#dd1d21,#f87171)' },
                axion: { label:'Axion',      color:'#cc1e2a', bg:'#fff0f0', abbr:'AXN', logoColor:'linear-gradient(135deg,#7f1d1d,#dc2626)'  },
                puma:  { label:'Puma',       color:'#e5810f', bg:'#fff5e8', abbr:'PMA', logoColor:'linear-gradient(135deg,#c2410c,#fb923c)'  },
                gulf:  { label:'Gulf',       color:'#c07a10', bg:'#fffbeb', abbr:'GUL', logoColor:'linear-gradient(135deg,#92400e,#d97706)'  },
                otras: { label:'Otras',      color:'#64748b', bg:'#f1f5f9', abbr:'EST', logoColor:'linear-gradient(135deg,#475569,#94a3b8)'  },
              };
              const FUEL_TYPE_LABEL = {
                NAFTA_SUPER:    'Nafta Super',
                NAFTA_PREMIUM:  'Nafta Premium',
                DIESEL:         'Diesel',
                DIESEL_PREMIUM: 'Diesel Premium',
                GNC:            'GNC',
                CARGA_ELECTRICA:'Carga Eléctrica',
                LUBRICANTES:    'Lubricantes',
                TIENDA:         'Tienda',
                TODOS:          'Todos los productos',
              };
              const TRUST = {
                OFFICIAL:          { label:'Verificado Oficial',        color:'#16a34a', bg:'#dcfce7', bd:'#86efac', dot:'#16a34a' },
                AUTO_VERIFIED:     { label:'Verificado Automáticamente', color:'#1d4ed8', bg:'#dbeafe', bd:'#bfdbfe', dot:'#1d4ed8' },
                SCRAPING_VERIFIED: { label:'Verificado por Scraping',   color:'#b45309', bg:'#fef3c7', bd:'#fde68a', dot:'#b45309' },
              };
              const DIA_ABR  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
              const TODAY    = new Date().getDay();
              const normFuel = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
              const normFuelQ = normFuel(fuelSearch);
              const allFuel  = (fuelItems || []);
              const dateStr  = new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
              const dayName  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][TODAY];
              const fmtEnd   = s => s ? new Date(s).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}) : '—';

              /* ─── HOY ─── */
              const todayFuel = allFuel
                .filter(i => i.benefitType !== 'LOYALTY' && (!i.validDays || i.validDays.length===7 || i.validDays.includes(TODAY)))
                .sort((a,b) => {
                  const da = (a.discountPercent||0)+(a.cashbackPercent||0);
                  const db = (b.discountPercent||0)+(b.cashbackPercent||0);
                  return db-da || (a.endDate||'9999').localeCompare(b.endDate||'9999');
                });

              /* ─── filtro categoría ─── */
              const MAIN_STATIONS = ['YPF','Shell','Axion','Puma'];
              // Al buscar, ignora el filtro de estación y busca en todo
              let catItems = fuelSearch.trim()
                ? allFuel.filter(i =>
                    [i.station, i.wallet, i.bank, i.retailApp, i.loyaltyProgram, i.description, i.category, ...(i.fuelType||[])]
                      .some(s => normFuel(s).includes(normFuelQ))
                  )
                : (() => {
                    switch (fuelCat) {
                      case 'ypf':       return allFuel.filter(i => i.category === 'ypf');
                      case 'shell':     return allFuel.filter(i => i.category === 'shell');
                      case 'axion':     return allFuel.filter(i => i.category === 'axion');
                      case 'puma':      return allFuel.filter(i => i.category === 'puma');
                      case 'gulf':      return allFuel.filter(i => i.category === 'gulf');
                      case 'bancos':    return allFuel.filter(i => i.bank && i.benefitType !== 'LOYALTY');
                      case 'billeteras':return allFuel.filter(i => !i.bank && i.benefitType !== 'LOYALTY');
                      case 'puntos':    return allFuel.filter(i => i.benefitType === 'LOYALTY');
                      default:          return allFuel;
                    }
                  })();

              /* ─── HOY Card ─── */
              const FuelHoyCard = ({ item }) => {
                const pct = item.discountPercent || item.cashbackPercent || 0;
                const wm  = APP_META[item.wallet] || { abbr:(item.wallet||'?').slice(0,2).toUpperCase(), bg:'#e2e8f0', fg:'#475569' };
                const st  = FUEL_STATIONS[item.category] || FUEL_STATIONS.otras;
                return (
                  <div style={{ background:'rgba(255,255,255,.07)', border:'1px solid rgba(255,255,255,.11)', borderRadius:6, padding:'7px 10px' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:3 }}>
                      <div style={{ width:22, height:22, borderRadius:4, background:wm.bg, display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, fontWeight:900, color:wm.fg, flexShrink:0 }}>{wm.abbr}</div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:11, fontWeight:700, color:'#fff', lineHeight:1.2, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{item.wallet}</div>
                        <div style={{ fontSize:11, color:'rgba(255,255,255,.5)' }}>{st.label} · {(item.fuelType||[]).slice(0,2).map(f=>FUEL_TYPE_LABEL[f]||f).join(' · ')}</div>
                      </div>
                      <div style={{ fontSize:18, fontWeight:900, color:'#fff', letterSpacing:'-1px', flexShrink:0 }}>{pct>0?`${pct}%`:'Pts'}</div>
                    </div>
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                      <span style={{ fontSize:11, fontWeight:600, color:'rgba(255,255,255,.55)' }}>{BENEFIT_TYPE_META[item.benefitType]?.label || item.benefitType}</span>
                      <span style={{ fontSize:11, color:'rgba(255,255,255,.38)' }}>hasta {fmtEnd(item.endDate)}</span>
                    </div>
                  </div>
                );
              };

              /* ─── Promo Card ─── */
              const FuelCard = ({ item }) => {
                const trust   = TRUST[item.verificationLevel] || TRUST.SCRAPING_VERIFIED;
                const pct     = item.discountPercent || item.cashbackPercent || 0;
                const st      = FUEL_STATIONS[item.category] || FUEL_STATIONS.otras;
                const pm      = { QR_PROPIO:{label:'QR Propio',bg:'#d1fae5',tx:'#065f46',bd:'#6ee7b7'}, TARJETA:{label:'Tarjeta',bg:'#ede9fe',tx:'#5b21b6',bd:'#ddd6fe'}, APP:{label:'App',bg:'#dbeafe',tx:'#1d4ed8',bd:'#bfdbfe'} }[item.paymentMethod] || {label:item.paymentMethod,bg:'#f1f5f9',tx:'#475569',bd:'#e2e8f0'};
                const btm     = BENEFIT_TYPE_META[item.benefitType] || BENEFIT_TYPE_META.DISCOUNT;
                const allDays = !item.validDays || item.validDays.length===7;
                const isToday = allDays || item.validDays?.includes(TODAY);
                const acc     = isToday ? st.color : '#94a3b8';
                return (
                  <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:4, overflow:'hidden', borderLeft:`4px solid ${acc}` }}>
                    {/* Header */}
                    <div style={{ padding:'10px 14px 6px', display:'flex', alignItems:'flex-start', gap:10 }}>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
                          <span style={{ fontSize:12, fontWeight:700, color:'var(--txt-1)' }}>{item.wallet}</span>
                          {item.loyaltyProgram && <span style={{ fontSize:11, fontWeight:600, padding:'1px 6px', borderRadius:3, background:st.bg, color:st.color, border:`1px solid ${st.color}33` }}>{item.loyaltyProgram}</span>}
                        </div>
                        <div style={{ fontSize:10, color:'var(--txt-3)', marginTop:1 }}>
                          <span style={{ fontWeight:700, color:st.color }}>{st.label}</span>
                          {item.retailApp && ` · ${item.retailApp}`}
                        </div>
                      </div>
                      <span style={{ display:'inline-flex', alignItems:'center', gap:4, fontSize:11, fontWeight:700, padding:'2px 7px', borderRadius:4, background:trust.bg, color:trust.color, border:`1px solid ${trust.bd}`, flexShrink:0 }}>
                        <span style={{ width:5, height:5, borderRadius:'50%', background:trust.dot, display:'inline-block' }}/>
                        {trust.label}
                      </span>
                    </div>
                    {/* Porcentaje + detalles */}
                    {item.benefitType !== 'LOYALTY' ? (
                      <div style={{ padding:'4px 14px 8px', display:'flex', alignItems:'center', gap:10 }}>
                        <div style={{ flexShrink:0 }}>
                          <div style={{ fontSize:30, fontWeight:900, color:st.color, lineHeight:1, letterSpacing:'-1px' }}>{pct}%</div>
                          <div style={{ fontSize:11, fontWeight:700, color:'var(--txt-3)', textTransform:'uppercase', letterSpacing:'.07em', marginTop:2 }}>{btm.label}</div>
                        </div>
                        <div style={{ flex:1 }}>
                          <div style={{ display:'flex', flexWrap:'wrap', gap:3, marginBottom:4 }}>
                            {isToday && !allDays && <span style={{ fontSize:11, fontWeight:800, padding:'2px 6px', borderRadius:4, background:'#dcfce7', color:'#16a34a', border:'1px solid #86efac' }}>Hoy</span>}
                            {allDays ? <span style={{ fontSize:11, padding:'2px 6px', borderRadius:4, background:'var(--surface-2)', color:'var(--txt-2)', border:'1px solid var(--border)', fontWeight:600 }}>Todos los días</span>
                              : item.validDays?.map(d=><span key={d} style={{ fontSize:11, padding:'2px 6px', borderRadius:4, background:d===TODAY?'#16a34a':'var(--surface-2)', color:d===TODAY?'#fff':'var(--txt-2)', border:`1px solid ${d===TODAY?'#16a34a':'var(--border)'}`, fontWeight:600 }}>{DIA_ABR[d]}</span>)
                            }
                          </div>
                          <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
                            <span style={{ fontSize:11, fontWeight:700, padding:'2px 7px', borderRadius:4, background:pm.bg, color:pm.tx, border:`1px solid ${pm.bd}` }}>{pm.label}</span>
                            {(item.fuelType||[]).filter(f=>f!=='TODOS').slice(0,2).map(f=>(
                              <span key={f} style={{ fontSize:11, padding:'2px 6px', borderRadius:4, background:st.bg, color:st.color, border:`1px solid ${st.color}22`, fontWeight:600 }}>{FUEL_TYPE_LABEL[f]||f}</span>
                            ))}
                            <span style={{ fontSize:11, padding:'2px 6px', borderRadius:4, background:'var(--surface-2)', color:'var(--txt-3)', border:'1px solid var(--border)' }}>hasta {fmtEnd(item.endDate)}</span>
                          </div>
                        </div>
                      </div>
                    ) : (
                      /* Loyalty card especial */
                      <div style={{ padding:'8px 14px', background:st.bg, borderTop:`1px solid ${st.color}22` }}>
                        {item.loyaltyInfo ? (
                          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 }}>
                            {[['Acumulación', item.loyaltyInfo.acumulacion], ['Canje', item.loyaltyInfo.canje]].map(([label, val]) => (
                              <div key={label}>
                                <div style={{ fontSize:10, fontWeight:700, color:st.color, textTransform:'uppercase', letterSpacing:'.06em', marginBottom:2 }}>{label}</div>
                                <div style={{ fontSize:10, color:'var(--txt-2)', fontWeight:500 }}>{val}</div>
                              </div>
                            ))}
                          </div>
                        ) : null}
                      </div>
                    )}
                    {/* Descripción */}
                    <div style={{ padding:'6px 14px', background:'var(--surface-2)', borderTop:'1px solid var(--border-lt)', fontSize:10, color:'var(--txt-2)', lineHeight:1.5 }}>{item.description}</div>
                    {/* Footer */}
                    <div style={{ padding:'5px 14px 7px', borderTop:'1px solid var(--border-lt)' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:6, minWidth:0, marginBottom:5 }}>
                        <a href={item.sourceUrl} target="_blank" rel="noopener noreferrer"
                          style={{ fontSize:11, color:'#44685c', textDecoration:'none', flex:1, minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', display:'block' }}
                        >{item.sourceUrl}</a>
                        <span style={{ fontSize:11, color:'var(--txt-3)', flexShrink:0, whiteSpace:'nowrap' }}>
                          {item.lastValidation ? new Date(item.lastValidation).toLocaleDateString('es-AR') : '—'}
                        </span>
                      </div>
                      <div style={{ display:'flex', gap:4, justifyContent:'flex-end' }}>
                        <button onClick={()=>setFuelModal(item)}
                          style={{ fontSize:11, fontWeight:700, padding:'3px 8px', borderRadius:4, border:`1px solid ${trust.color}`, background:'none', color:trust.color, cursor:'pointer', fontFamily:'inherit', whiteSpace:'nowrap' }}
                          onMouseEnter={e=>e.currentTarget.style.background=trust.bg}
                          onMouseLeave={e=>e.currentTarget.style.background='none'}
                        >¿Cómo verificamos?</button>
                      </div>
                    </div>
                  </div>
                );
              };

              /* ─── Verify Modal ─── */
              const FuelVerifyModal = ({ item }) => {
                const t   = TRUST[item.verificationLevel] || TRUST.SCRAPING_VERIFIED;
                const fmt = s => s ? new Date(s).toLocaleDateString('es-AR') : '—';
                const st  = FUEL_STATIONS[item.category] || FUEL_STATIONS.otras;
                const rows = [
                  { label:'Estación',       val: item.station },
                  { label:'Fuente',         val: item.wallet + (item.loyaltyProgram ? ` · ${item.loyaltyProgram}` : '') },
                  { label:'URL oficial',    val: item.sourceUrl, link:true },
                  { label:'Última revisión',val: fmt(item.lastValidation || item.lastVerified) },
                  { label:'Método',         val: { OFFICIAL:'API Oficial', AUTO_VERIFIED:'Endpoint JSON', SCRAPING_VERIFIED:'Scraping Validado' }[item.verificationLevel] || item.sourceType },
                  { label:'Nivel confianza',val: t.label, badge:true },
                  { label:'Combustibles',   val: (item.fuelType||[]).map(f=>FUEL_TYPE_LABEL[f]||f).join(', ') },
                ];
                return (
                  <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setFuelModal(null)}>
                    <div style={{ background:'var(--surface)', borderRadius:4, border:'1px solid var(--border)', padding:28, width:'100%', maxWidth:440, boxShadow:'0 24px 64px var(--shadow-md)' }}>
                      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20 }}>
                        <div>
                          <div style={{ fontSize:10, color:'var(--txt-3)', fontWeight:700, letterSpacing:'.08em', textTransform:'uppercase', marginBottom:4 }}>Trazabilidad · {st.label}</div>
                          <div style={{ fontSize:17, fontWeight:800, color:'var(--txt-1)' }}>¿Cómo verificamos este beneficio?</div>
                        </div>
                        <button onClick={()=>setFuelModal(null)} style={{ background:'var(--surface-2)', border:'1px solid var(--border)', borderRadius:4, width:44, height:44, cursor:'pointer', fontFamily:'inherit', fontSize:18, color:'var(--txt-2)', flexShrink:0 }}>×</button>
                      </div>
                      {rows.map(r=>(
                        <div key={r.label} style={{ display:'flex', justifyContent:'space-between', padding:'8px 0', borderBottom:'1px solid var(--border-lt)' }}>
                          <span style={{ fontSize:11, color:'var(--txt-3)', fontWeight:600 }}>{r.label}</span>
                          <div style={{ fontSize:12, color:'var(--txt-1)', fontWeight:500, textAlign:'right', maxWidth:250 }}>
                            {r.badge ? <span style={{ fontSize:11, fontWeight:700, padding:'2px 7px', borderRadius:4, background:t.bg, color:t.color, border:`1px solid ${t.bd}` }}>{r.val}</span>
                             : r.link ? <a href={r.val} target="_blank" rel="noopener noreferrer" style={{ color:'#44685c', fontSize:11, wordBreak:'break-all' }}>{r.val}</a>
                             : r.val}
                          </div>
                        </div>
                      ))}
                      {item.sourceExplanation && (
                        <div style={{ marginTop:16, padding:'10px 14px', background:'var(--surface-2)', borderRadius:4, border:'1px solid var(--border-lt)' }}>
                          <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.07em', textTransform:'uppercase', marginBottom:6 }}>Explicación</div>
                          <p style={{ fontSize:12, color:'var(--txt-2)', lineHeight:1.65, margin:0 }}>{item.sourceExplanation}</p>
                        </div>
                      )}
                    </div>
                  </div>
                );
              };

              return (
                <div className="fade-in">
                  {fuelModal && <FuelVerifyModal item={fuelModal}/>}

                  {/* ─── BUSCADOR ─── */}
                  <div style={{ position:'relative', marginBottom:14 }}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--txt-3)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ position:'absolute', left:14, top:'50%', transform:'translateY(-50%)', pointerEvents:'none' }}>
                      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" placeholder="Buscar billetera, banco, estación, tipo de combustible…"
                      value={fuelSearch} onChange={e=>setFuelSearch(e.target.value)}
                      style={{ width:'100%', paddingLeft:42, paddingRight:14, paddingTop:12, paddingBottom:12, background:'var(--input-bg)', border:'1px solid var(--border)', borderRadius:6, fontFamily:'inherit', fontSize:15, color:'var(--txt-1)', outline:'none', boxSizing:'border-box' }}
                    />
                  </div>

                  {/* ─── FILTROS ─── */}
                  <div className="nav-scroll" style={{ display:'flex', gap:0, marginBottom:20, borderBottom:'1px solid var(--border)' }}>
                    {FUEL_CATS.map(c=>{
                      const on  = fuelCat === c.key;
                      const cnt = !['all','bancos','billeteras','puntos'].includes(c.key) && fuelItems ? allFuel.filter(i=>i.category===c.key).length : null;
                      return (
                        <button key={c.key} onClick={()=>{setFuelCat(c.key);setFuelSearch('');}}
                          style={{ padding:'11px 18px', cursor:'pointer', fontFamily:'inherit', fontSize:13, fontWeight:on?700:500, background:'none', border:'none', borderBottom:`2px solid ${on?'#44685c':'transparent'}`, marginBottom:-1, color:on?'#44685c':'var(--txt-2)', whiteSpace:'nowrap', transition:'color .15s', display:'flex', alignItems:'center', gap:6 }}
                          onMouseEnter={e=>{if(!on)e.currentTarget.style.color='var(--txt-1)';}}
                          onMouseLeave={e=>{if(!on)e.currentTarget.style.color='var(--txt-2)';}}
                        >
                          {c.label}
                          {cnt !== null && (
                            <span style={{ fontSize:11, fontWeight:600, padding:'1px 7px', borderRadius:10, background:on?'#44685c22':'var(--surface-2)', color:on?'#44685c':'var(--txt-3)' }}>{cnt}</span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {/* ─── LOADING ─── */}
                  {fuelLoading && (
                    <div style={{ display:'flex', justifyContent:'center', padding:'40px 0', gap:6 }}>
                      {[0,1,2].map(i=><div key={i} style={{ width:7,height:7,borderRadius:'50%',background:'#c2410c',animation:`blink 1.2s ease-in-out ${i*.2}s infinite` }}/>)}
                    </div>
                  )}

                  {/* ─── CONTENIDO ─── */}
                  {!fuelLoading && (() => {
                    if (catItems.length === 0 && fuelItems) {
                      return <div style={{ textAlign:'center', padding:'40px 0', color:'var(--txt-3)', fontSize:13 }}>Sin resultados.</div>;
                    }

                    /* Vista "Todas" — grid plano */
                    if (fuelCat === 'all') {
                      return (
                        <div style={{ display:'grid', gridTemplateColumns:isMobile?'1fr':'repeat(2,1fr)', gap:14, marginBottom:20 }}>
                          {catItems.map(item=><FuelCard key={item.id} item={item}/>)}
                        </div>
                      );
                    }

                    /* Vista "Puntos" — loyalty especial */
                    if (fuelCat === 'puntos') {
                      return (
                        <div style={{ marginBottom:20 }}>
                          <div style={{ fontSize:11, color:'var(--txt-3)', marginBottom:14 }}>
                            {catItems.length} programa{catItems.length!==1?'s':''} de puntos y fidelización
                          </div>
                          <div style={{ display:'grid', gridTemplateColumns:isMobile?'1fr':'repeat(2,1fr)', gap:14 }}>
                            {catItems.map(item=><FuelCard key={item.id} item={item}/>)}
                          </div>
                        </div>
                      );
                    }

                    /* Vista estación / bancos / billeteras — directorio */
                    const walletKeys = [...new Set(catItems.map(i=>i.wallet))];
                    const catColor   = FUEL_CATS.find(c=>c.key===fuelCat)?.color || '#44685c';
                    return (
                      <div style={{ marginBottom:20 }}>
                        <div style={{ fontSize:11, color:'var(--txt-3)', marginBottom:14 }}>
                          {walletKeys.length} fuentes · {catItems.filter(i=>i.benefitType!=='LOYALTY').length} beneficio{catItems.length!==1?'s':''} verificado{catItems.length!==1?'s':''}
                        </div>
                        {walletKeys.map(wKey => {
                          const wPromos = catItems.filter(i=>i.wallet===wKey);
                          const wm  = APP_META[wKey] || { abbr:(wKey||'?').slice(0,2).toUpperCase(), bg:'linear-gradient(135deg,#e2e8f0,#cbd5e1)', fg:'#475569' };
                          const fi  = wPromos[0];
                          return (
                            <div key={wKey} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:4, marginBottom:12, overflow:'hidden', borderLeft:`4px solid ${catColor}` }}>
                              <div style={{ padding:'12px 16px', display:'flex', alignItems:'center', gap:12 }}>
                                <div style={{ width:40, height:40, borderRadius:8, flexShrink:0, background:wm.bg, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:900, color:wm.fg, letterSpacing:'-.5px', boxShadow:'0 2px 6px rgba(0,0,0,.2)' }}>{wm.abbr}</div>
                                <div style={{ flex:1, minWidth:0 }}>
                                  <div style={{ fontWeight:800, fontSize:14, color:'var(--txt-1)', lineHeight:1.2 }}>{wKey}</div>
                                  {fi?.bank && <div style={{ fontSize:10, color:'var(--txt-3)' }}>{fi.bank}</div>}
                                </div>
                                <span style={{ fontSize:11, fontWeight:800, padding:'3px 9px', borderRadius:4, background:'#dcfce7', color:'#16a34a', border:'1px solid #86efac', flexShrink:0 }}>
                                  {wPromos.length} beneficio{wPromos.length!==1?'s':''}
                                </span>
                              </div>
                              <div style={{ padding:'0 16px 14px', display:'grid', gridTemplateColumns:(!isMobile&&wPromos.length>1)?'repeat(2,1fr)':'1fr', gap:10 }}>
                                {wPromos.map(item=><FuelCard key={item.id} item={item}/>)}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })()}

                  {/* ─── TOP AHORRO COMBUSTIBLE ─── */}
                  {fuelItems && (() => {
                    const MONTHLY_SPEND = 200000;
                    const byWallet = {};
                    for (const item of allFuel) {
                      if (item.benefitType === 'LOYALTY') continue;
                      const pct     = (item.discountPercent||0)+(item.cashbackPercent||0);
                      const savings = Math.round(MONTHLY_SPEND * pct / 100);
                      if (!byWallet[item.wallet]) byWallet[item.wallet] = { wallet: item.wallet, savings: 0, bestPct: 0, stations: new Set() };
                      byWallet[item.wallet].savings += savings;
                      byWallet[item.wallet].bestPct = Math.max(byWallet[item.wallet].bestPct, pct);
                      byWallet[item.wallet].stations.add(item.station);
                    }
                    const top = Object.values(byWallet).sort((a,b)=>b.savings-a.savings).slice(0,6);
                    const maxSavings = top[0]?.savings || 1;
                    return (
                      <div style={{ marginBottom:18 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
                          <div style={{ fontSize:16 }}>⛽</div>
                          <div>
                            <div style={{ fontSize:13, fontWeight:800, color:'var(--txt-1)' }}>Top Ahorro Combustible</div>
                            <div style={{ fontSize:10, color:'var(--txt-3)' }}>Ahorro mensual estimado · 40L × 2 cargas · $2.500/L promedio (referencial)</div>
                          </div>
                        </div>
                        <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:4, overflow:'hidden' }}>
                          {top.map((w, idx) => {
                            const wm  = APP_META[w.wallet] || { abbr:(w.wallet||'?').slice(0,2).toUpperCase(), bg:'#e2e8f0', fg:'#475569' };
                            const bar = Math.round((w.savings/maxSavings)*100);
                            return (
                              <div key={w.wallet} style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 14px', borderBottom:idx<top.length-1?'1px solid var(--border-lt)':'' }}>
                                <div style={{ fontSize:11, fontWeight:700, color:'var(--txt-3)', width:14, textAlign:'center' }}>{idx+1}</div>
                                <div style={{ width:28, height:28, borderRadius:4, background:wm.bg, display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, fontWeight:900, color:wm.fg, flexShrink:0 }}>{wm.abbr}</div>
                                <div style={{ flex:1, minWidth:0 }}>
                                  <div style={{ fontSize:12, fontWeight:700, color:'var(--txt-1)' }}>{w.wallet}</div>
                                  <div style={{ fontSize:11, color:'var(--txt-3)', marginTop:2 }}>{[...w.stations].join(' · ')}</div>
                                  <div style={{ marginTop:4, height:4, background:'var(--border)', borderRadius:2, overflow:'hidden' }}>
                                    <div style={{ width:`${bar}%`, height:'100%', background:'#c2410c', borderRadius:2, transition:'width .4s' }}/>
                                  </div>
                                </div>
                                <div style={{ textAlign:'right', flexShrink:0 }}>
                                  <div style={{ fontSize:12, fontWeight:800, color:'#c2410c' }}>~${w.savings.toLocaleString('es-AR')}</div>
                                  <div style={{ fontSize:11, color:'var(--txt-3)' }}>hasta {w.bestPct}% off</div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                        <div style={{ fontSize:11, color:'var(--txt-3)', marginTop:6, textAlign:'center' }}>
                          Estimación referencial. El ahorro real depende de la cantidad de cargas, el precio del combustible y el tope mensual de cada beneficio.
                        </div>
                      </div>
                    );
                  })()}

                  {/* ─── LEYENDA ─── */}
                  {fuelItems && (
                    <div style={{ padding:'14px 16px', background:'var(--surface-3)', border:'1px solid var(--border-lt)', borderRadius:4 }}>
                      <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-2)', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:10 }}>Niveles de confianza</div>
                      <div style={{ display:'flex', flexWrap:'wrap', gap:10 }}>
                        {Object.entries(TRUST).map(([k,t])=>(
                          <div key={k} style={{ display:'flex', alignItems:'center', gap:6 }}>
                            <span style={{ width:7, height:7, borderRadius:'50%', background:t.dot, flexShrink:0 }}/>
                            <span style={{ fontSize:10, color:'var(--txt-2)', fontWeight:600 }}>{t.label}</span>
                          </div>
                        ))}
                      </div>
                      <div style={{ fontSize:10, color:'var(--txt-3)', marginTop:8, lineHeight:1.6 }}>
                        Solo se muestran beneficios con fuente oficial, URL de respaldo y fecha de validación.
                        {` Actualmente: ${allFuel.filter(i=>i.benefitType!=='LOYALTY').length} descuentos y ${allFuel.filter(i=>i.benefitType==='LOYALTY').length} programas de puntos activos.`}
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}

            {activeTab === 'movilidad' && (() => {
              /* ─── constantes ─── */
              const MOB_CATS = [
                { key:'all',              label:'Todas',          color:'#44685c' },
                { key:'subte',            label:'Subte',          color:'#1d4ed8' },
                { key:'trenes',           label:'Trenes',         color:'#7c3aed' },
                { key:'colectivos',       label:'Colectivos',     color:'#0f766e' },
                { key:'telepeajes',       label:'Telepeajes',     color:'#b45309' },
                { key:'estacionamientos', label:'Estacionamiento',color:'#be185d' },
                { key:'movilidad_privada',label:'Privado',        color:'#0369a1' },
                { key:'micromovilidad',   label:'Micromovilidad', color:'#059669' },
              ];
              const MOB_TRANSPORT = {
                subte:            { label:'Subte',          color:'#1d4ed8', bg:'#eff6ff'  },
                trenes:           { label:'Trenes',         color:'#7c3aed', bg:'#f5f3ff'  },
                colectivos:       { label:'Colectivos',     color:'#0f766e', bg:'#f0fdf4'  },
                telepeajes:       { label:'Telepeajes',     color:'#b45309', bg:'#fffbeb'  },
                estacionamientos: { label:'Estacionamiento',color:'#be185d', bg:'#fdf2f8'  },
                movilidad_privada:{ label:'Privado',        color:'#0369a1', bg:'#eff6ff'  },
                micromovilidad:   { label:'Micromovilidad', color:'#059669', bg:'#f0fdf4'  },
              };
              const MOB_PAY = {
                SUBE:        { label:'SUBE',          bg:'#d1fae5', tx:'#065f46', bd:'#6ee7b7' },
                TELEPASE:    { label:'TelePASE',      bg:'#fef3c7', tx:'#b45309', bd:'#fde68a' },
                QR_PROPIO:   { label:'QR Propio',     bg:'#d1fae5', tx:'#065f46', bd:'#6ee7b7' },
                TARJETA:     { label:'Tarjeta',       bg:'#ede9fe', tx:'#5b21b6', bd:'#ddd6fe' },
                NFC:         { label:'NFC',           bg:'#dbeafe', tx:'#1d4ed8', bd:'#bfdbfe' },
                APP:         { label:'App',           bg:'#dbeafe', tx:'#1d4ed8', bd:'#bfdbfe' },
              };
              const TRUST = {
                OFFICIAL:          { label:'Verificado Oficial',       color:'#16a34a', bg:'#dcfce7', bd:'#86efac', dot:'#16a34a' },
                AUTO_VERIFIED:     { label:'Verificado Automáticamente',color:'#1d4ed8', bg:'#dbeafe', bd:'#bfdbfe', dot:'#1d4ed8' },
                SCRAPING_VERIFIED: { label:'Verificado por Scraping',  color:'#b45309', bg:'#fef3c7', bd:'#fde68a', dot:'#b45309' },
              };
              const DIA_ABR = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
              const TODAY   = new Date().getDay();
              const normMob = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
              const normMobQ = normMob(movilidadSearch);

              const allItems = (movilidadItems || []);
              const dateStr  = new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
              const dayName  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][TODAY];
              const fmtEnd   = s => s ? new Date(s).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}) : '—';

              /* ─── HOY ─── */
              const todayItems = allItems
                .filter(i => !i.validDays || i.validDays.length===7 || i.validDays.includes(TODAY))
                .sort((a,b) => {
                  const da = (a.discountPercent||0)+(a.cashbackPercent||0);
                  const db = (b.discountPercent||0)+(b.cashbackPercent||0);
                  if (db!==da) return db-da;
                  return (a.endDate||'9999').localeCompare(b.endDate||'9999');
                });

              /* ─── filtro de categoría + búsqueda (búsqueda ignora categoría) ─── */
              let catItems = movilidadSearch.trim()
                ? allItems.filter(i =>
                    [i.wallet, i.bank, i.provider, i.category, i.description, ...(i.lines||[])]
                      .some(s => normMob(s).includes(normMobQ))
                  )
                : (movilidadCat === 'all' ? allItems : allItems.filter(i => i.category === movilidadCat));

              /* ─── HOY Card ─── */
              const MobHoyCard = ({ item }) => {
                const pct = item.discountPercent || item.cashbackPercent || 0;
                const wm  = APP_META[item.wallet] || { abbr:(item.wallet||'?').slice(0,2).toUpperCase(), bg:'#e2e8f0', fg:'#475569' };
                const tr  = MOB_TRANSPORT[item.category] || MOB_TRANSPORT.subte;
                return (
                  <div style={{ background:'rgba(255,255,255,.07)', border:'1px solid rgba(255,255,255,.11)', borderRadius:6, padding:'7px 10px' }}>
                    <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:3 }}>

              const MobCard = ({ item }) => {

                        >{item.sourceUrl}</a>
                        <span style={{ fontSize:11, color:'var(--txt-3)', flexShrink:0, whiteSpace:'nowrap' }}>

                      <div style={{ display:'flex', gap:4, justifyContent:'flex-end' }}>

                          onMouseEnter={e=>e.currentTarget.style.background=trust.bg}
                          onMouseLeave={e=>e.currentTarget.style.background='none'}
                        >¿Cómo verificamos?</button>
                      </div>
                    </div>
                  </div>
                );
              };

              /* ─── Verification Modal ─── */
              const MobVerifyModal = ({ item }) => {
                const t   = TRUST[item.verificationLevel] || TRUST.SCRAPING_VERIFIED;
                const fmt = s => s ? new Date(s).toLocaleDateString('es-AR') : '—';
                const rows = [
                  { label:'Fuente',          val: item.wallet + (item.provider ? ` vía ${item.provider}` : '') },
                  { label:'URL oficial',     val: item.sourceUrl, link:true },
                  { label:'Última revisión', val: fmt(item.lastValidation || item.lastVerified) },
                  { label:'Método',          val: { OFFICIAL:'API Oficial', AUTO_VERIFIED:'Endpoint JSON', SCRAPING:'Scraping Validado', SCRAPING_VERIFIED:'Scraping Validado' }[item.verificationLevel] || item.sourceType },
                  { label:'Nivel confianza', val: t.label, badge:true },
                  { label:'Categoría',       val: (MOB_TRANSPORT[item.category]?.label) || item.category },
                  { label:'Líneas',          val: (item.lines||[]).join(', ') || '—' },

                return (
                  <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setMovilidadModal(null)}>

                        <div>

                        <button onClick={()=>setMovilidadModal(null)} style={{ background:'var(--surface-2)', border:'1px solid var(--border)', borderRadius:4, width:44, height:44, cursor:'pointer', fontFamily:'inherit', fontSize:18, color:'var(--txt-2)', flexShrink:0 }}>×</button>

                          <p style={{ fontSize:12, color:'var(--txt-2)', lineHeight:1.65, margin:0 }}>{item.sourceExplanation}</p>

                      )}

              return (
                <div className="fade-in">
                  {movilidadModal && <MobVerifyModal item={movilidadModal} />}

                  {/* ─── BUSCADOR ─── */}
                  <div style={{ position:'relative', marginBottom:14 }}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--txt-3)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ position:'absolute', left:14, top:'50%', transform:'translateY(-50%)', pointerEvents:'none' }}>
                      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" placeholder="Buscar billetera, banco, transporte, línea…"

/* ═══════════════════════════════════════
   API HELPERS
═══════════════════════════════════════ */
async function tFetch(url, ms = 6000) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(tid);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch(e) { clearTimeout(tid); throw e; }
}

async function apiFetch(url) {
  for (const src of [
    url,
    `https://corsproxy.io/?${encodeURIComponent(url)}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  ]) {
    try { return await tFetch(src, 7000); } catch {}
  }
  throw new Error(`unreachable: ${url}`);
}

async function fetchGobNews() {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch('/api/news', { signal: ctrl.signal });
    clearTimeout(tid);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    if (j.ok && j.items?.length) return j.items;
    throw new Error(j.error || 'Sin noticias disponibles.');
  } catch (e) {
    clearTimeout(tid);
    throw new Error('No se pudo acceder al feed. Verificá tu conexión o reintentá en unos minutos.');
  }
}

const fmtDate = d => d.toISOString().slice(0,10);
const today   = ()  => fmtDate(new Date());
const daysAgo = n   => fmtDate(new Date(Date.now() - n * 86400000));

async function bcraVar(varId) {
  const url = `https://api.bcra.gob.ar/estadisticas/v4.0/monetarias/${varId}?desde=${daysAgo(20)}&hasta=${today()}`;
  const j   = await apiFetch(url);
  const det = j?.results?.[0]?.detalle;
  if (!det?.length) throw new Error('BCRA: sin datos');
  return det[0].valor;
}

/* Fetch de cotizaciones desde dolarapi.com  */
async function fetchCotizaciones() {
  const endpoints = {
    blue:       'https://dolarapi.com/v1/dolares/blue',
    oficial:    'https://dolarapi.com/v1/dolares/oficial',
    mep:        'https://dolarapi.com/v1/dolares/bolsa',
    ccl:        'https://dolarapi.com/v1/dolares/contadoconliqui',
    tarjeta:    'https://dolarapi.com/v1/dolares/tarjeta',
    mayorista:  'https://dolarapi.com/v1/dolares/mayorista',
    cripto:     'https://dolarapi.com/v1/dolares/cripto',
  };
  const result = {};
  await Promise.allSettled(
    Object.entries(endpoints).map(async ([key, url]) => {
      try { result[key] = await tFetch(url, 5000); } catch { /* keep prev */ }
    })
  );
  return result;
}

  );
}


/* ═══════════════════════════════════════
   SIMULATOR MODAL
═══════════════════════════════════════ */
function SimModal({ item, currency, onClose, t }) {
  const [amount, setAmount] = useState('');
  const [days,   setDays]   = useState(30);
  const sym  = currency === 'ARS' ? '$' : 'U$S';
  const num  = parseFloat(amount) || 0;
  const gain = num > 0 ? +(num * item.tna / 100 / 365 * days).toFixed(2) : null;

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{
        background:'var(--surface)', borderRadius:2, padding:24, width:'100%', maxWidth:420,
        border:'1px solid var(--border)', boxShadow:'0 24px 64px var(--shadow-md)',
      }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18 }}>
          <div>
            <div style={{ color:'#94a3b8', fontSize:11, marginBottom:2, fontWeight:600 }}>{t.simTitle}</div>
            <div style={{ color:'#0f172a', fontSize:18, fontWeight:800 }}>{item.app}</div>
          </div>
          <button onClick={onClose} style={{
            background:'#f1f5f9', border:'1px solid #e2e8f0', borderRadius:2,
            width:32, height:32, cursor:'pointer', color:'#64748b',
            fontSize:18, lineHeight:'30px', textAlign:'center', fontFamily:'inherit',
          }}>×</button>
        </div>

        {/* TNA pill */}
        <div style={{
          display:'flex', justifyContent:'space-between', alignItems:'center',
          background:'#f5fed4', border:'1px solid #b8e070', borderRadius:2,
          padding:'12px 16px', marginBottom:18,
        }}>
          <div>
            <div style={{ color:'#64748b', fontSize:10, fontWeight:700, letterSpacing:'.06em', marginBottom:2 }}>{t.colTNA}</div>
            <div style={{ color:'#44685c', fontWeight:900, fontSize:30, lineHeight:1 }}>{item.tna}%</div>
          </div>
          <div style={{ textAlign:'right' }}>
            <div style={{ color:'#64748b', fontSize:10, fontWeight:700, letterSpacing:'.06em', marginBottom:2 }}>{t.colLimite.toUpperCase()}</div>
            <div style={{ color:'#0f172a', fontSize:13, fontWeight:700 }}>{item.limit}</div>
          </div>
        </div>

        {/* Amount */}
        <div style={{ marginBottom:14 }}>
          <label style={{ display:'block', color:'#64748b', fontSize:12, fontWeight:600, marginBottom:6 }}>
            {t.simAmount} ({sym})
          </label>
          <div style={{ position:'relative' }}>
            <span style={{ position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', color:'#94a3b8', fontWeight:700 }}>{sym}</span>
            <input
              type="number" value={amount} onChange={e => setAmount(e.target.value)} placeholder="100.000"
              style={{
                width:'100%', paddingLeft:40, paddingRight:12, paddingTop:10, paddingBottom:10,
                background:'#f8fafc', border:'1px solid #e2e8f0', borderRadius:2,
                color:'#0f172a', fontSize:16, fontWeight:700, outline:'none', fontFamily:'inherit',
              }}
            />
          </div>
        </div>

        {/* Days */}
        <div style={{ marginBottom:18 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
            <span style={{ color:'#64748b', fontSize:12, fontWeight:600 }}>{t.simDays}</span>
            <div style={{ display:'flex', alignItems:'center', gap:4 }}>
              <input
                type="number" min="1" max="365" value={days}
                onChange={e => { const v = Math.min(365, Math.max(1, parseInt(e.target.value) || 1)); setDays(v); }}
                onBlur={e => { if (!e.target.value) setDays(1); }}
                style={{
                  width:52, padding:'2px 4px', background:'#f8fafc', border:'1px solid #b8e070',
                  borderRadius:2, color:'#44685c', fontSize:16, fontWeight:800, textAlign:'center',
                  fontFamily:'inherit', outline:'none',
                }}
              />
              <span style={{ color:'#44685c', fontWeight:800, fontSize:12 }}>días</span>
            </div>
          </div>
          <input
            type="range" min="1" max="365" value={days}
            onChange={e => {
              const v = +e.target.value;
              const snaps = [1, 30, 90, 180, 365];
              const nearest = snaps.find(s => Math.abs(s - v) <= 8);
              setDays(nearest ?? v);
            }}
          />
          <div style={{ position:'relative', height:14, marginTop:3 }}>
            {[1, 30, 90, 180, 365].map(d => (
              <span key={d} style={{
                position:'absolute',
                left:`${(d - 1) / 364 * 100}%`,
                transform: d === 1 ? 'translateX(0)' : d === 365 ? 'translateX(-100%)' : 'translateX(-50%)',
                fontSize:10,
                color: days === d ? '#44685c' : '#94a3b8',
                fontWeight: days === d ? 700 : 400,
                whiteSpace:'nowrap',
              }}>{d}d</span>
            ))}
          </div>
        </div>

        {/* Result */}
        {gain !== null && (
          <div style={{
            background:'#f5fed4', border:'1px solid #b8e070', borderRadius:2,
            padding:'12px 16px', marginBottom:18,
          }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
              <span style={{ color:'#64748b', fontSize:13 }}>{t.simGain}</span>
              <span style={{ color:'#44685c', fontWeight:900, fontSize:16 }}>
                +{sym} {gain.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}
              </span>
            </div>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:8 }}>
              <span style={{ color:'#64748b', fontSize:13 }}>{t.simTotal}</span>
              <span style={{ color:'#0f172a', fontWeight:800, fontSize:15 }}>
                {sym} {(num+gain).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}
              </span>
            </div>
            <div style={{ fontSize:10, color:'#94a3b8', paddingTop:8, borderTop:'1px solid #d8eea0' }}>{t.simNote}</div>
          </div>
        )}

        <div style={{ display:'flex', gap:10 }}>
          <button onClick={onClose} style={{
            flex:1, padding:'10px 0', borderRadius:2, cursor:'pointer', fontFamily:'inherit',
            background:'#f1f5f9', border:'1px solid #e2e8f0', color:'#64748b', fontWeight:600, fontSize:14,
          }}>{t.simClose}</button>
          <button style={{
            flex:2, padding:'10px 0', borderRadius:2, cursor:'pointer', fontFamily:'inherit',
            background:'#44685c', border:'none', color:'#fff', fontWeight:800, fontSize:14,
          }}>{t.simGo}</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   HISTORIAL CHART — SVG puro, sin dependencias externas
═══════════════════════════════════════ */
function HistorialChart({ data, valueKey, color, formatY, formatX, sourceInfo }) {
  const RANGES = [
    { label:'30D',  pts:30  },
    { label:'90D',  pts:90  },
    { label:'180D', pts:180 },
    { label:'Todo', pts:Infinity },
  ];
  const [rangeIdx,  setRangeIdx]  = useState(1);
  const [panOffset, setPanOffset] = useState(0);
  const [hoverIdx,  setHoverIdx]  = useState(null);
  const dragRef = useRef({ active:false, startX:0, startOff:0 });

  const valid = (data || []).filter(d => d[valueKey] != null && !isNaN(+d[valueKey]));

  useEffect(() => { setPanOffset(0); setRangeIdx(1); }, [data]);

  if (valid.length < 2) {
    return (
      <div style={{ height:140, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:8 }}>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" strokeWidth="1.5">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span style={{ fontSize:13, fontWeight:500, color:'#cbd5e1' }}>Sin datos suficientes</span>
      </div>
    );
  }

  const range   = Math.min(RANGES[rangeIdx].pts, valid.length);
  const maxPan  = Math.max(0, valid.length - range);
  const pan     = Math.min(Math.max(0, panOffset), maxPan);
  const end     = valid.length - pan;
  const start   = Math.max(0, end - range);
  const visible = valid.slice(start, end);

  const W=560, H=210, PL=68, PR=20, PT=16, PB=36;
  const cW=W-PL-PR, cH=H-PT-PB;

  const vals = visible.map(d => +d[valueKey]);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const pad  = Math.max((maxV-minV)*.15, 0.5);
  const lo=minV-pad, hi=maxV+pad;

  const xOf = i => PL + (i / Math.max(1, visible.length-1)) * cW;
  const yOf = v => PT + cH - ((v-lo)/(hi-lo)) * cH;

  const pathD = visible.map((pt,i) =>
    `${i===0?'M':'L'} ${xOf(i).toFixed(1)} ${yOf(+pt[valueKey]).toFixed(1)}`
  ).join(' ');
  const areaD = `${pathD} L ${xOf(visible.length-1).toFixed(1)} ${(PT+cH).toFixed(1)} L ${xOf(0).toFixed(1)} ${(PT+cH).toFixed(1)} Z`;
  const step  = Math.max(1, Math.ceil(visible.length/6));
  const yTicks = [0,.25,.5,.75,1].map(p => lo+(hi-lo)*p);
  const hoverPt = hoverIdx !== null ? visible[hoverIdx] : null;

  /* ── Drag ── */
  const pxPerPt = cW / Math.max(1, range - 1);
  const getX    = e => e.touches ? e.touches[0].clientX : e.clientX;
  const onDown  = e => { dragRef.current = { active:true, startX:getX(e), startOff:pan }; setHoverIdx(null); };
  const onMove  = e => {
    if (!dragRef.current.active) return;
    const dx     = getX(e) - dragRef.current.startX;
    const newPan = Math.min(Math.max(0, dragRef.current.startOff - Math.round(dx/pxPerPt)), maxPan);
    setPanOffset(newPan);
  };
  const onUp = () => { dragRef.current.active = false; };

  const step4    = Math.max(1, Math.round(range/4));
  const canBack  = pan < maxPan;
  const canFwd   = pan > 0;
  const navBtn   = (enabled) => ({
    width:30, height:30, border:'1px solid var(--border)', borderRadius:4,
    background: enabled ? 'var(--surface)' : 'var(--surface-2)',
    color: enabled ? color : '#cbd5e1',
    cursor: enabled ? 'pointer' : 'default',
    display:'flex', alignItems:'center', justifyContent:'center',
    fontFamily:'inherit', fontSize:13, flexShrink:0, transition:'background .12s',
  });

  return (
    <div>
      {/* Controles: rangos + flechas */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10, flexWrap:'wrap', gap:6 }}>
        <div style={{ display:'flex', gap:3 }}>
          {RANGES.map((r,i) => {
            const pts = Math.min(r.pts, valid.length);
            if (pts < 7) return null;
            const active = rangeIdx === i;
            return (
              <button key={r.label}
                onClick={() => { setRangeIdx(i); setPanOffset(0); setHoverIdx(null); }}
                style={{
                  padding:'4px 10px', fontSize:11, fontWeight:active?700:500,
                  background: active ? color : 'var(--surface-2)',
                  color: active ? '#fff' : '#64748b',
                  border:`1px solid ${active ? color : 'var(--border)'}`,
                  borderRadius:4, cursor:'pointer', fontFamily:'inherit', transition:'all .15s',
                }}
              >{r.label}</button>
            );
          })}
        </div>
        <div style={{ display:'flex', gap:5, alignItems:'center' }}>
          <button disabled={!canBack} onClick={() => { setPanOffset(Math.min(maxPan, pan+step4)); setHoverIdx(null); }} style={navBtn(canBack)}>◀</button>
          <button disabled={!canFwd}  onClick={() => { setPanOffset(Math.max(0, pan-step4));      setHoverIdx(null); }} style={navBtn(canFwd)}>▶</button>
          {pan > 0 && (
            <button onClick={() => setPanOffset(0)} style={{
              padding:'4px 8px', fontSize:11, fontWeight:600,
              border:`1px solid ${color}`, borderRadius:4,
              background:'transparent', color:color, cursor:'pointer',
              fontFamily:'inherit', transition:'all .12s',
            }}>Hoy ▸</button>
          )}
        </div>
      </div>

      {/* SVG con drag */}
      <div style={{ position:'relative', userSelect:'none', cursor: dragRef.current.active ? 'grabbing' : 'grab' }}
        onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
        onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}
      >
        {hoverPt && (
          <div style={{
            position:'absolute', top:4, left:PL, zIndex:5, pointerEvents:'none',
            background:'var(--surface)', border:'1px solid var(--border)', borderRadius:4,
            padding:'5px 12px', boxShadow:'0 2px 10px var(--shadow-md)',
            display:'flex', gap:10, alignItems:'baseline', flexWrap:'wrap',
          }}>
            <span style={{ fontSize:10, color:'#94a3b8', fontWeight:500 }}>{formatX(hoverPt.date)}</span>
            <span style={{ fontSize:16, fontWeight:900, color:'var(--txt-1)', letterSpacing:'-.5px' }}>{formatY(+hoverPt[valueKey])}</span>
            {hoverPt.badlar != null && valueKey==='tna' && (
              <span style={{ fontSize:10, color:'#94a3b8' }}>BADLAR {hoverPt.badlar.toFixed(2)}%</span>
            )}
          </div>
        )}

        <svg viewBox={`0 0 ${W} ${H}`} style={{ width:'100%', height:'auto', display:'block', overflow:'visible' }}>
          {yTicks.map((v,i) => (
            <g key={i}>
              <line x1={PL} y1={yOf(v).toFixed(1)} x2={PL+cW} y2={yOf(v).toFixed(1)} stroke="var(--border-lt)" strokeWidth="1"/>
              <text x={PL-8} y={(yOf(v)+4).toFixed(1)} textAnchor="end" fontSize="11" fill="#94a3b8" fontFamily="Inter,sans-serif">{formatY(v)}</text>
            </g>
          ))}
          {visible.map((pt,i) => {
            if (i%step!==0 && i!==visible.length-1) return null;
            return <text key={i} x={xOf(i).toFixed(1)} y={PT+cH+22} textAnchor="middle" fontSize="10" fill="#94a3b8" fontFamily="Inter,sans-serif">{formatX(pt.date)}</text>;
          })}
          <path d={areaD} fill={color} fillOpacity="0.07" stroke="none"/>
          <path d={pathD} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
          {visible.map((pt,i) => (
            <circle key={i}
              cx={xOf(i).toFixed(1)} cy={yOf(+pt[valueKey]).toFixed(1)}
              r={hoverIdx===i?5:2.5}
              fill={hoverIdx===i?color:'var(--surface)'} stroke={color} strokeWidth="1.8"
              style={{ cursor:'crosshair', pointerEvents:'all' }}
              onMouseEnter={e=>{ e.stopPropagation(); if(!dragRef.current.active) setHoverIdx(i); }}
              onMouseLeave={e=>{ e.stopPropagation(); setHoverIdx(null); }}
            />
          ))}
          {hoverIdx!==null && (
            <line x1={xOf(hoverIdx).toFixed(1)} y1={PT} x2={xOf(hoverIdx).toFixed(1)} y2={PT+cH}
              stroke={color} strokeWidth="1" strokeDasharray="4 3" strokeOpacity=".4"/>
          )}
        </svg>
      </div>

      {/* Fuente de datos */}
      {sourceInfo && (
        <div style={{ marginTop:8, padding:'6px 10px', background:'var(--surface-2)', border:'1px solid var(--border-lt)', borderRadius:4, display:'flex', alignItems:'flex-start', gap:6 }}>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0, marginTop:2 }}>
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div style={{ fontSize:10, color:'#94a3b8', lineHeight:1.6 }}>
            <strong style={{ color:'#64748b' }}>Fuente:</strong> {sourceInfo.source} · {sourceInfo.variable}
            {sourceInfo.calcFormula && <span> · <em>{sourceInfo.calcFormula}</em></span>}
          </div>
        </div>
      )}
    </div>
  );
}

              { label:'TNA resultante', val: arsItem ? `${arsItem.tna.toFixed(2)}%` : '—', sub:'calculada hoy', color:'#44685c' },
            ].map(r => (
              <div key={r.label} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 0', borderBottom:'1px solid var(--border-lt)' }}>
                <div>
                  <div style={{ fontSize:11, fontWeight:600, color:'var(--txt-2)' }}>{r.label}</div>
                  <div style={{ fontSize:10, color:'var(--txt-3)' }}>{r.sub}</div>
                </div>
                <div style={{ fontSize:14, fontWeight:900, color:r.color }}>{r.val}</div>
              </div>
            ))}

            {meta && (
              <div style={{ marginTop:12, fontSize:10, color:'#94a3b8', lineHeight:1.6, padding:'8px 10px', background:'var(--surface-2)', borderRadius:4, border:'1px solid var(--border-lt)' }}>
                <strong style={{ color:'#64748b' }}>Fuente BADLAR:</strong> {meta.source}
                <br/><strong style={{ color:'#64748b' }}>Variable:</strong> {meta.variable}
                <br/><strong style={{ color:'#64748b' }}>Spread:</strong> {meta.spreadType}
                {meta.disclaimer && <><br/><br/><em>{meta.disclaimer}</em></>}
              </div>
            )}
          </div>
        </div>
      )}

      {/* Empty state */}
      {!loading && !error && data.length === 0 && (
        <div style={{ ...cardBase, textAlign:'center', padding:'52px 24px', marginBottom:24 }}>
          <div style={{ fontSize:14, fontWeight:700, color:'var(--txt-1)', marginBottom:6 }}>Sin datos disponibles</div>
          <div style={{ fontSize:12, color:'#94a3b8' }}>No se encontraron datos de BCRA para esta app.</div>
        </div>
      )}

      {/* Stats + Info */}
      {!loading && !error && (() => {
        const infoItem = arsItem || profile;
        if (!infoItem) return null;

        const tnas      = data.filter(d => d.tna != null).map(d => +d.tna);
        const badlars   = data.filter(d => d.badlar != null).map(d => +d.badlar);
        const hasTnas   = tnas.length > 1;
        const maxTNA    = hasTnas ? Math.max(...tnas) : null;
        const minTNA    = hasTnas ? Math.min(...tnas) : null;
        const avgTNA    = hasTnas ? tnas.reduce((a,b) => a+b,0)/tnas.length : null;
        const variation = hasTnas ? tnas[tnas.length-1] - tnas[0] : null;
        const maxDate   = hasTnas ? data.find(d => +d.tna === maxTNA)?.date : null;
        const minDate   = hasTnas ? data.find(d => +d.tna === minTNA)?.date : null;
        const avgBadlar = badlars.length ? badlars.reduce((a,b)=>a+b,0)/badlars.length : null;

        const TYPE_LABELS = { fci:'FCI Money Market', cuenta:'Cta. Remunerada', plazo:'Plazo Fijo', crypto:'Crypto / Staking', on:'ON Corporativas' };
        const TYPE_COLORS = { fci:{ bg:'#dbeafe', tx:'#1d4ed8', bd:'#bfdbfe' }, cuenta:{ bg:'#d8eea0', tx:'#44685c', bd:'#b8e070' }, plazo:{ bg:'#ede9fe', tx:'#7c3aed', bd:'#ddd6fe' }, crypto:{ bg:'#fef3c7', tx:'#b45309', bd:'#fde68a' }, on:{ bg:'#fee2e2', tx:'#b91c1c', bd:'#fecaca' } };
        const SEC_LABELS  = { variable:'Rendimiento Variable', garantizado:'Rendimiento Garantizado', especial:'Condición Especial' };
        const SEC_COLORS  = { variable:'#1d4ed8', garantizado:'#44685c', especial:'#b45309' };
        const tc  = TYPE_COLORS[infoItem.type] || { bg:'#f1f5f9', tx:'#64748b', bd:'#e2e8f0' };
        const sec = infoItem.section || 'variable';

        return (
          <div style={{ marginBottom:24 }}>

            {/* Stats del período */}
            {hasTnas && (
              <div style={{ marginBottom:8 }}>
                <div className="stats-5">
                  {[
                    { label:'TNA actual',      val:`${(infoItem.tna ?? tnas[tnas.length-1]).toFixed(1)}%`, sub:'BADLAR + spread hoy', color:'#44685c' },
                    { label:'Máxima período',  val:`${maxTNA.toFixed(1)}%`,   sub:fmtDate(maxDate),         color:'#16a34a' },
                    { label:'Mínima período',  val:`${minTNA.toFixed(1)}%`,   sub:fmtDate(minDate),         color:'#dc2626' },
                    { label:'Promedio',        val:`${avgTNA.toFixed(1)}%`,   sub:`${tnas.length} días háb.`, color:'#1d4ed8' },
                    { label:'Variación total', val:`${variation>=0?'+':''}${variation.toFixed(1)} pp`, sub:'primer → último', color: variation>=0?'#16a34a':'#dc2626' },
                  ].map(s => (
                    <div key={s.label} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:2, borderTop:`3px solid ${s.color}`, padding:'14px 16px' }}>
                      <div style={{ fontSize:9, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:5 }}>{s.label}</div>
                      <div style={{ fontSize:21, fontWeight:900, color:s.color, letterSpacing:'-.5px', lineHeight:1 }}>{s.val}</div>
                      <div style={{ fontSize:10, color:'var(--txt-3)', marginTop:5 }}>{s.sub}</div>
                    </div>
                  ))}
                </div>
                <div style={{ fontSize:10, color:'#94a3b8', padding:'4px 8px' }}>
                  * Estadísticas calculadas sobre TNA = BADLAR real (BCRA v4.0 Variable 7) + spread {meta?.spreadType || 'estimado'}
                  {avgBadlar && ` · BADLAR promedio del período: ${avgBadlar.toFixed(2)}%`}
                </div>
              </div>
            )}

            {/* Info + Últimas sesiones */}
            <div style={{ display:'grid', gridTemplateColumns: hasTnas ? '1fr 1fr' : '1fr', gap:16 }}>

              {/* Sobre la plataforma */}
              <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:2, padding:24 }}>
                <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:14, paddingBottom:10, borderBottom:'1px solid var(--border-lt)' }}>
                  Sobre la plataforma
                </div>
                <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:14 }}>
                  <span style={{ fontSize:11, fontWeight:700, padding:'3px 10px', borderRadius:6, background:tc.bg, color:tc.tx, border:`1px solid ${tc.bd}` }}>
                    {TYPE_LABELS[infoItem.type] || infoItem.type}
                  </span>
                  <span style={{ fontSize:11, fontWeight:700, padding:'3px 10px', borderRadius:6, background:'var(--surface-2)', color:SEC_COLORS[sec], border:'1px solid var(--border)' }}>
                    {SEC_LABELS[sec]}
                  </span>
                  {infoItem.promo && (
                    <span style={{ fontSize:11, fontWeight:700, padding:'3px 10px', borderRadius:6, background:'#fef3c7', color:'#b45309', border:'1px solid #fde68a' }}>PROMO</span>
                  )}
                </div>
                <p style={{ fontSize:13, color:'var(--txt-2)', lineHeight:1.65, marginBottom:16 }}>{infoItem.info}</p>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom: infoItem.condicion ? 12 : 0 }}>
                  {[
                    { label:'Límite de inversión', val:infoItem.limit, sub:'informado por la entidad' },
                    { label:'Spread vs BADLAR',    val:profile ? `${profile.spread>=0?'+':''}${profile.spread} pp` : '—', sub: meta?.spreadType || 'estimado' },
                  ].map(f => (
                    <div key={f.label} style={{ padding:'10px 12px', background:'var(--surface-2)', borderRadius:2, border:'1px solid var(--border-lt)' }}>
                      <div style={{ fontSize:9, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.07em', textTransform:'uppercase', marginBottom:4 }}>{f.label}</div>
                      <div style={{ fontSize:13, fontWeight:800, color:'var(--txt-1)' }}>{f.val}</div>
                      <div style={{ fontSize:10, color:'var(--txt-3)', marginTop:2 }}>{f.sub}</div>
                    </div>
                  ))}
                </div>
                {infoItem.condicion && (
                  <div style={{ marginTop:12, padding:'9px 12px', background:'#fffbeb', border:'1px solid #fde68a', borderRadius:2, display:'flex', alignItems:'flex-start', gap:8 }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b45309" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0, marginTop:1 }}>
                      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    <span style={{ fontSize:11, color:'#b45309', fontWeight:600, lineHeight:1.5 }}>{infoItem.condicion}</span>
                  </div>
                )}
              </div>

              {/* Últimas sesiones */}
              {hasTnas && (
                <div style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:2, padding:24 }}>
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14, paddingBottom:10, borderBottom:'1px solid var(--border-lt)' }}>
                    <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.1em', textTransform:'uppercase' }}>Últimas sesiones</div>
                    <span style={{ fontSize:9, color:'#94a3b8' }}>BCRA v4.0</span>
                  </div>
                  <table style={{ width:'100%', borderCollapse:'collapse' }}>
                    <thead>
                      <tr>
                        {['Fecha','BADLAR','TNA','Δ'].map((h,i) => (
                          <th key={h} style={{ textAlign:i===0?'left':'right', fontSize:9, fontWeight:700, color:'var(--txt-3)', padding:'0 0 10px', letterSpacing:'.07em', textTransform:'uppercase' }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {data.slice(-8).reverse().map((entry, i, arr) => {
                        const prev   = arr[i+1];
                        const change = prev ? +entry.tna - +prev.tna : null;
                        const up     = change > 0, dn = change < 0;
                        return (
                          <tr key={entry.date} style={{ borderTop:'1px solid var(--border-lt)' }}>
                            <td style={{ padding:'8px 0', fontSize:12, color:'var(--txt-2)', fontWeight:500 }}>{fmtDate(entry.date)}</td>
                            <td style={{ padding:'8px 0', textAlign:'right', fontSize:11, color:'#64748b', fontWeight:500 }}>{entry.badlar != null ? `${entry.badlar.toFixed(2)}%` : '—'}</td>
                            <td style={{ padding:'8px 0', textAlign:'right', fontSize:13, fontWeight:900, color:'var(--txt-1)', letterSpacing:'-.3px' }}>{(+entry.tna).toFixed(2)}%</td>
                            <td style={{ padding:'8px 0', textAlign:'right' }}>
                              {change == null ? <span style={{ color:'var(--txt-3)', fontSize:11 }}>—</span> : (
                                <span style={{ fontSize:10, fontWeight:700, padding:'2px 6px', borderRadius:4, background:up?'#dcfce7':dn?'#fee2e2':'var(--surface-2)', color:up?'#16a34a':dn?'#dc2626':'var(--txt-3)' }}>
                                  {up?'▲':dn?'▼':'━'} {Math.abs(change).toFixed(2)}
                                </span>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                  <SourceRow m={meta} />
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {/* Disclaimer */}
      <div style={{ padding:'10px 14px', background:'var(--surface-3)', border:'1px solid var(--border-lt)', borderRadius:2 }}>
        <p style={{ color:'#94a3b8', fontSize:11, lineHeight:1.65, margin:0 }}>
          {meta
            ? `Datos de TNA calculados sobre ${meta.source} (${meta.variable}). ${meta.disclaimer} ${t.disclaimer}`
            : t.disclaimer
          }
        </p>
      </div>
    </div>
  );
}

      style={{
        position:'relative', width:48, height:26, borderRadius:13, flexShrink:0,

function useWindowWidth() {
  const [w, setW] = useState(typeof window !== 'undefined' ? window.innerWidth : 1200);
  useEffect(() => {
    const h = () => setW(window.innerWidth);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);
  return w;
}

const DIA_ABR  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIA_FULL = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

function diasLabel(dias) {
  if (!dias || dias.length === 7) return 'Todos los días';
  if (dias.length === 1) return `Solo ${DIA_FULL[dias[0]]}`;
  return dias.map(d => DIA_ABR[d]).join(' · ');
}

function DiasBadges({ dias, today }) {
  const allDays = !dias || dias.length === 7;
  const appliesToday = dias?.includes(today);
  return (
    <div style={{ display:'flex', gap:4, flexWrap:'wrap', alignItems:'center' }}>
      {appliesToday && !allDays && (
        <span style={{ fontSize:9, fontWeight:800, padding:'2px 7px', borderRadius:4, background:'#dcfce7', color:'#16a34a', border:'1px solid #86efac' }}>Aplica hoy</span>
      )}
      {allDays ? (
        <span style={{ fontSize:9, fontWeight:700, padding:'2px 7px', borderRadius:4, background:'var(--surface-2)', color:'var(--txt-2)', border:'1px solid var(--border)' }}>Todos los días</span>
      ) : dias.map(d => (
        <span key={d} style={{
          fontSize:9, fontWeight:700, padding:'2px 7px', borderRadius:4,
          background: d === today ? '#16a34a' : 'var(--surface-2)',
          color:      d === today ? '#fff'    : 'var(--txt-2)',
          border:     `1px solid ${d === today ? '#16a34a' : 'var(--border)'}`,
        }}>{DIA_ABR[d]}</span>
      ))}
    </div>
  );
}

function PromotionCard({ item, onReport, reported }) {
  const [expanded,      setExpanded]      = useState(false);
  const [showAllMetodos, setShowAllMetodos] = useState(false);
  const today        = new Date().getDay();
  const allDays      = !item.validDays || item.validDays.length === 7;
  const activeToday  = item.activeToday ?? (allDays || item.validDays?.includes(today));
  const expiringSoon = item.expiringSoon ?? false;
  const score        = item.score ?? 0;
  const pct          = item.discountPercent || item.cashbackPercent || 0;
  const accentColor  = activeToday ? '#16a34a' : pct >= 30 ? '#16a34a' : pct >= 20 ? '#44685c' : pct >= 10 ? '#1d4ed8' : '#b45309';

  const wm  = APP_META[item.wallet] || { abbr:(item.wallet||'?').slice(0,2).toUpperCase(), bg:'#e2e8f0', fg:'#475569' };
  const btm = BENEFIT_TYPE_META[item.benefitType] || BENEFIT_TYPE_META.DISCOUNT;
  const pm  = PAYMENT_META[item.paymentMethod]    || { label:item.paymentMethod, bg:'#f1f5f9', tx:'#475569', bd:'#e2e8f0' };

  const fmtDate = s => { if (!s) return '—'; const [y,m,d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`; };
  const dayLabels = allDays ? ['Todos los días'] : (item.validDaysLabels || item.validDays?.map(d => DIA_ABR[d]));

  return (
    <div style={{
      background:'var(--surface)', border:'1px solid var(--border)', borderRadius:4, overflow:'hidden',
      borderLeft:`4px solid ${accentColor}`, transition:'box-shadow .15s',
    }}
      onMouseEnter={e => e.currentTarget.style.boxShadow='0 4px 18px var(--shadow-md)'}
      onMouseLeave={e => e.currentTarget.style.boxShadow='none'}
    >
      {/* Header: wallet + score + badges */}
      <div style={{ padding:'12px 16px 8px', display:'flex', alignItems:'flex-start', gap:10 }}>
        <div style={{ width:36, height:36, borderRadius:6, flexShrink:0, background:wm.bg, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:900, color:wm.fg, letterSpacing:'-.5px', boxShadow:'0 1px 4px rgba(0,0,0,.15)' }}>{wm.abbr}</div>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontWeight:700, fontSize:13, color:'var(--txt-1)', lineHeight:1.2 }}>{item.wallet}</div>
          <div style={{ fontSize:11, color:'var(--txt-3)' }}>{item.bank || item.supermarket}</div>
        </div>
        <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:4, flexShrink:0 }}>
          <div style={{ fontSize:9, fontWeight:700, background: score>=30?'#dcfce7':score>=20?'#dbeafe':'var(--surface-2)', color:score>=30?'#16a34a':score>=20?'#1d4ed8':'#64748b', border:`1px solid ${score>=30?'#86efac':score>=20?'#bfdbfe':'var(--border)'}`, borderRadius:4, padding:'2px 7px', letterSpacing:'.04em' }}>Score {score}</div>
          {expiringSoon && <span style={{ fontSize:9, fontWeight:700, padding:'2px 7px', borderRadius:4, background:'#fef3c7', color:'#b45309', border:'1px solid #fde68a' }}>Vence pronto</span>}
        </div>
      </div>

      {/* Benefit row */}
      <div style={{ padding:'4px 16px 10px', display:'flex', alignItems:'center', gap:14 }}>
        <div style={{ flexShrink:0 }}>
          <div style={{ fontSize:36, fontWeight:900, color:accentColor, lineHeight:1, letterSpacing:'-1px' }}>
            {pct > 0 ? `${pct}%` : 'Variable'}
          </div>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.07em', textTransform:'uppercase', marginTop:2 }}>{btm.label}</div>
        </div>
        <div style={{ flex:1 }}>
          {/* Days */}
          <div style={{ display:'flex', flexWrap:'wrap', gap:3, marginBottom:5 }}>
            {activeToday && !allDays && <span style={{ fontSize:9, fontWeight:800, padding:'2px 7px', borderRadius:4, background:'#dcfce7', color:'#16a34a', border:'1px solid #86efac' }}>Hoy</span>}
            {(dayLabels||[]).slice(0,4).map(d => (
              <span key={d} style={{ fontSize:9, fontWeight:600, padding:'2px 7px', borderRadius:4, background: (d==='Hoy'||activeToday&&!allDays&&item.validDays?.includes(today)) ? '#16a34a' : 'var(--surface-2)', color: 'var(--txt-2)', border:'1px solid var(--border)' }}>{d}</span>
            ))}
          </div>
          {/* Supermarkets */}
          <div style={{ display:'flex', flexWrap:'wrap', gap:3 }}>
            {(item.supermarketList||[item.supermarket]).slice(0,3).map((s,i) => (
              <span key={i} style={{ fontSize:10, fontWeight:600, padding:'2px 7px', borderRadius:4, background:'#f5feec', color:'#44685c', border:'1px solid #b8e070' }}>{s}</span>
            ))}
          </div>
        </div>
      </div>

      {/* Tags row */}
      <div style={{ padding:'0 16px 10px', display:'flex', flexWrap:'wrap', gap:5 }}>
        <span style={{ fontSize:10, fontWeight:700, padding:'3px 10px', borderRadius:4, background:pm.bg, color:pm.tx, border:`1px solid ${pm.bd}` }}>{pm.label}</span>
        {item.capAmount && <span style={{ fontSize:10, fontWeight:600, padding:'3px 10px', borderRadius:4, background:'var(--surface-2)', color:'var(--txt-2)', border:'1px solid var(--border)' }}>Tope ${item.capAmount.toLocaleString('es-AR')}</span>}
        <span style={{ fontSize:10, fontWeight:600, padding:'3px 10px', borderRadius:4, background:'var(--surface-2)', color:'var(--txt-3)', border:'1px solid var(--border)' }}>hasta {fmtDate(item.endDate)}</span>
      </div>

      {/* Conditions */}
      <div style={{ padding:'8px 16px', background:'var(--surface-2)', borderTop:'1px solid var(--border-lt)' }}>
        <div style={{ fontSize:11, color:'var(--txt-2)', lineHeight:1.55 }}>{item.description}</div>
        {expanded && item.conditions && (
          <div style={{ marginTop:8, fontSize:11, color:'var(--txt-3)', lineHeight:1.6, paddingTop:8, borderTop:'1px solid var(--border-lt)' }}>
            <strong style={{ color:'var(--txt-2)' }}>Condiciones:</strong> {item.conditions}
          </div>
        )}
        {expanded && item.sourceUrl && (
          <div style={{ marginTop:6, fontSize:10, color:'#94a3b8' }}>
            <strong style={{ color:'#64748b' }}>Fuente:</strong> <a href={item.sourceUrl} target="_blank" rel="noopener noreferrer" style={{ color:'#44685c', textDecoration:'none' }}>{item.sourceUrl}</a>
            {item.lastVerified && <span> · Verificado {new Date(item.lastVerified).toLocaleDateString('es-AR')}</span>}
          </div>
        )}
      </div>

      {/* Footer */}
      <div style={{ padding:'8px 16px', display:'flex', alignItems:'center', justifyContent:'space-between', borderTop:'1px solid var(--border-lt)', gap:6, flexWrap:'wrap' }}>
        <div style={{ display:'flex', gap:4 }}>
          {reported ? (
            <span style={{ fontSize:11, color:'#16a34a', fontWeight:600 }}>Reporte enviado</span>
          ) : (
            <button onClick={() => onReport(item.id)} style={{ fontSize:11, color:'var(--txt-3)', background:'none', border:'1px solid var(--border)', borderRadius:4, padding:'4px 9px', cursor:'pointer', fontFamily:'inherit', fontWeight:600, transition:'color .12s, border-color .12s' }}
              onMouseEnter={e => { e.currentTarget.style.color='#b45309'; e.currentTarget.style.borderColor='#b45309'; }}
              onMouseLeave={e => { e.currentTarget.style.color='var(--txt-3)'; e.currentTarget.style.borderColor='var(--border)'; }}
            >Reportar</button>
          )}
        </div>
        <button onClick={() => setExpanded(v => !v)} style={{ fontSize:11, fontWeight:700, color:'#44685c', background:'none', border:'1px solid #44685c', borderRadius:4, padding:'4px 12px', cursor:'pointer', fontFamily:'inherit', transition:'background .12s, color .12s' }}
          onMouseEnter={e => { e.currentTarget.style.background='#44685c'; e.currentTarget.style.color='#fff'; }}
          onMouseLeave={e => { e.currentTarget.style.background='none'; e.currentTarget.style.color='#44685c'; }}
        >{expanded ? 'Menos ↑' : 'Ver más ↓'}</button>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   TRANSPORTE DETALLE
═══════════════════════════════════════ */
function TransporteDetalle({ transporteId, transporteItem: itemProp, onBack, onReport, reported }) {
  const [item,    setItem]    = useState(itemProp || null);
  const [loading, setLoading] = useState(!itemProp);
  const [error,   setError]   = useState(null);

  useEffect(() => {
    if (item) return;
    setLoading(true);
    fetch('/api/transporte')
      .then(r => r.json())
      .then(j  => {
        const found = (j.items || []).find(i => i.id === transporteId);
        if (found) setItem(found); else setError('Beneficio no encontrado');
        setLoading(false);
      })
      .catch(() => { setError('No se pudo cargar la información'); setLoading(false); });
  }, [transporteId]);

  const fmtVig = s => {
    if (!s) return '—';
    const [y, m, d] = s.split('-');
    return `${d}/${m}/${y}`;
  };

  if (loading) return (
    <div style={{ display:'flex', justifyContent:'center', padding:'80px 0', gap:6 }}>
      {[0,1,2].map(i => <div key={i} style={{ width:7, height:7, borderRadius:'50%', background:'#44685c', animation:`blink 1.2s ease-in-out ${i*.2}s infinite` }} />)}
    </div>
  );

  if (error || !item) return (
    <div style={{ maxWidth:900, margin:'40px auto', padding:'0 20px' }}>
      <button onClick={onBack} style={{ background:'none', border:'1px solid var(--border)', borderRadius:2, padding:'9px 16px', cursor:'pointer', fontFamily:'inherit', fontSize:13, fontWeight:600, color:'var(--txt-2)', marginBottom:24 }}>← Volver</button>
      <div style={{ background:'var(--surface)', border:'1px solid #fecaca', borderTop:'4px solid #dc2626', borderRadius:2, padding:'40px 24px', textAlign:'center' }}>
        <div style={{ fontSize:14, fontWeight:700, color:'#dc2626', marginBottom:6 }}>{error || 'No encontrado'}</div>
      </div>
    </div>
  );

  const logoMeta = APP_META[item.entidad] || { abbr: item.abbr, bg: item.bg, fg: item.fg };
  const benefitColor = item.porcentaje_max === 100 ? '#16a34a' : item.porcentaje_max >= 50 ? '#44685c' : item.porcentaje_max >= 20 ? '#1d4ed8' : item.porcentaje_max > 0 ? '#7c3aed' : '#b45309';

  const cardBase = { background:'var(--surface)', border:'1px solid var(--border)', borderRadius:2, padding:24 };

  return (
    <div style={{ maxWidth:1000, margin:'40px auto 0', padding:'0 20px 60px' }} className="fade-in">

      {/* Cabecera */}
      <div style={{ display:'flex', alignItems:'flex-start', gap:16, marginBottom:28, flexWrap:'wrap' }}>
        <button onClick={onBack} style={{
          display:'flex', alignItems:'center', gap:6, flexShrink:0,
          background:'none', border:'1px solid var(--border)', borderRadius:2,
          padding:'9px 16px', cursor:'pointer', fontFamily:'inherit',
          fontSize:13, fontWeight:600, color:'var(--txt-2)', transition:'border-color .15s, color .15s',
        }}
          onMouseEnter={e => { e.currentTarget.style.borderColor='#44685c'; e.currentTarget.style.color='#44685c'; }}
          onMouseLeave={e => { e.currentTarget.style.borderColor='var(--border)'; e.currentTarget.style.color='var(--txt-2)'; }}
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Volver
        </button>

        <div style={{ display:'flex', alignItems:'center', gap:14, flex:1, minWidth:200 }}>
          <div style={{
            width:52, height:52, borderRadius:10, flexShrink:0,
            background:logoMeta.bg, display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:14, fontWeight:900, color:logoMeta.fg, letterSpacing:'-.5px',
            boxShadow:'0 2px 8px rgba(0,0,0,.2)',
          }}>{logoMeta.abbr}</div>
          <div>
            <h1 style={{ margin:0, fontSize:22, fontWeight:900, color:'var(--txt-1)', lineHeight:1.15 }}>{item.entidad}</h1>
            <p style={{ margin:'3px 0 0', fontSize:13, color:'var(--txt-3)' }}>{item.subtitulo}</p>
          </div>
        </div>

        <div style={{ display:'flex', gap:6, flexShrink:0, alignItems:'center', flexWrap:'wrap' }}>
          {item.promo && <span style={{ fontSize:10, fontWeight:800, padding:'3px 9px', borderRadius:4, background:'#fef3c7', color:'#b45309', border:'1px solid #fde68a' }}>PROMO</span>}
          {item.verificado
            ? <span style={{ fontSize:10, fontWeight:700, padding:'3px 9px', borderRadius:4, background:'#dcfce7', color:'#16a34a', border:'1px solid #86efac' }}>Verificado</span>
            : <span style={{ fontSize:10, fontWeight:700, padding:'3px 9px', borderRadius:4, background:'#fef3c7', color:'#b45309', border:'1px solid #fde68a' }}>Sin verificar</span>
          }
        </div>
      </div>

      {/* Banner de beneficio */}
      <div style={{ background:`linear-gradient(135deg,${benefitColor}18,${benefitColor}08)`, border:`1px solid ${benefitColor}33`, borderLeft:`4px solid ${benefitColor}`, borderRadius:4, padding:'20px 24px', marginBottom:24, display:'flex', alignItems:'center', gap:24, flexWrap:'wrap' }}>
        <div style={{ flexShrink:0 }}>
          <div style={{ fontSize:48, fontWeight:900, color:benefitColor, lineHeight:1, letterSpacing:'-2px' }}>{item.beneficio_label}</div>
          <div style={{ fontSize:11, fontWeight:700, color:benefitColor, opacity:.7, letterSpacing:'.1em', textTransform:'uppercase', marginTop:4 }}>{item.tipo_beneficio}</div>
        </div>
        <div style={{ flex:1, display:'flex', flexWrap:'wrap', gap:16 }}>
          <div>
            <div style={{ fontSize:9, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:5 }}>Rubros</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
              {item.rubros.map(r => { const rm = RUBRO_META[r] || { label:r, bg:'#f1f5f9', tx:'#475569' }; return <span key={r} style={{ fontSize:12, fontWeight:600, padding:'4px 11px', borderRadius:20, background:rm.bg, color:rm.tx }}>{rm.label}</span>; })}
            </div>
          </div>
          <div>
            <div style={{ fontSize:9, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:5 }}>Tope</div>
            <div style={{ fontSize:14, fontWeight:800, color:'var(--txt-1)' }}>{item.tope_label || 'Sin límite informado'}</div>
          </div>
          <div>
            <div style={{ fontSize:9, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:5 }}>Válido hasta</div>
            <div style={{ fontSize:14, fontWeight:800, color:'var(--txt-1)' }}>{fmtVig(item.fecha_expiracion)}</div>
          </div>
        </div>
      </div>

      {/* Grilla: Cómo usarlo + Métodos */}
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, marginBottom:20 }}>

        {/* Cómo usarlo */}
        <div style={{ ...cardBase, borderTop:'3px solid #44685c' }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:16, paddingBottom:10, borderBottom:'1px solid var(--border-lt)' }}>
            Cómo usarlo
          </div>
          {(item.pasos || []).map((paso, i) => (
            <div key={i} style={{ display:'flex', gap:12, marginBottom: i < item.pasos.length-1 ? 14 : 0 }}>
              <div style={{ width:24, height:24, borderRadius:'50%', background:'#44685c', color:'#fff', fontSize:11, fontWeight:800, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, marginTop:1 }}>{i+1}</div>
              <p style={{ margin:0, fontSize:13, color:'var(--txt-2)', lineHeight:1.65 }}>{paso}</p>
            </div>
          ))}
        </div>

        {/* Métodos de pago y cobertura */}
        <div style={{ ...cardBase, borderTop:'3px solid #1d4ed8' }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:16, paddingBottom:10, borderBottom:'1px solid var(--border-lt)' }}>
            Métodos de pago
          </div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:20 }}>
            {item.metodos_pago.map(m => { const mm = METODO_META[m] || { label:m, bg:'#f1f5f9', tx:'#475569', bd:'#e2e8f0' }; return <span key={m} style={{ fontSize:12, fontWeight:700, padding:'5px 12px', borderRadius:4, background:mm.bg, color:mm.tx, border:`1px solid ${mm.bd}` }}>{mm.label}</span>; })}
          </div>

          <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:10 }}>
            Cobertura
          </div>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:20 }}>
            {item.rubros.map(r => { const rm = RUBRO_META[r] || { label:r, bg:'#f1f5f9', tx:'#475569' }; return <span key={r} style={{ fontSize:12, fontWeight:600, padding:'5px 12px', borderRadius:20, background:rm.bg, color:rm.tx }}>{rm.label}</span>; })}
          </div>

          <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:10 }}>
            Condición de uso
          </div>
          <p style={{ margin:0, fontSize:13, color:'var(--txt-2)', lineHeight:1.65 }}>
            {item.condicion}
            {item.segmento && <span style={{ display:'block', marginTop:6, color:'#b45309', fontWeight:600, fontSize:12 }}>{item.segmento}</span>}
          </p>
        </div>
      </div>

      {/* Requisitos */}
      {item.requisitos?.length > 0 && (
        <div style={{ ...cardBase, borderTop:'3px solid #b45309', marginBottom:20 }}>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.1em', textTransform:'uppercase', marginBottom:14, paddingBottom:10, borderBottom:'1px solid var(--border-lt)' }}>
            Requisitos y condiciones
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(300px,1fr))', gap:10 }}>
            {item.requisitos.map((req, i) => (
              <div key={i} style={{ display:'flex', gap:10, padding:'10px 14px', background:'var(--surface-2)', borderRadius:4, border:'1px solid var(--border-lt)' }}>
                <div style={{ width:6, height:6, borderRadius:'50%', background:'#b45309', flexShrink:0, marginTop:7 }} />
                <p style={{ margin:0, fontSize:13, color:'var(--txt-2)', lineHeight:1.65 }}>{req}</p>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Fuente + Reportar */}
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:16, padding:'12px 16px', background:'var(--surface-3)', border:'1px solid var(--border-lt)', borderRadius:4, flexWrap:'wrap' }}>
        <div style={{ fontSize:11, color:'var(--txt-3)', lineHeight:1.6 }}>
          <strong style={{ color:'var(--txt-2)' }}>Fuente:</strong> {item.fuente}
          {item.reportes_error > 0 && <span style={{ color:'#b45309', marginLeft:8 }}>· {item.reportes_error} reporte{item.reportes_error>1?'s':''} de cambio</span>}
        </div>
        {reported ? (
          <span style={{ fontSize:12, color:'#16a34a', fontWeight:600, flexShrink:0 }}>Reporte enviado</span>
        ) : (
          <button onClick={() => onReport(item.id)} style={{
            fontSize:12, color:'var(--txt-3)', background:'none', border:'1px solid var(--border)',
            borderRadius:4, padding:'5px 12px', cursor:'pointer', fontFamily:'inherit', fontWeight:600,
            flexShrink:0, transition:'color .12s, border-color .12s',
          }}
            onMouseEnter={e => { e.currentTarget.style.color='#b45309'; e.currentTarget.style.borderColor='#b45309'; }}
            onMouseLeave={e => { e.currentTarget.style.color='var(--txt-3)'; e.currentTarget.style.borderColor='var(--border)'; }}
          >Reportar cambio</button>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   TRANSPORTE CARD
═══════════════════════════════════════ */
const METODO_META = {
  nfc:                 { label:'NFC',         bg:'#dbeafe', tx:'#1d4ed8', bd:'#bfdbfe' },
  qr:                  { label:'QR',          bg:'#d1fae5', tx:'#065f46', bd:'#6ee7b7' },
  tarjeta_contactless: { label:'Contactless', bg:'#ede9fe', tx:'#5b21b6', bd:'#ddd6fe' },
  google_pay:          { label:'Google Pay',  bg:'#f1f5f9', tx:'#334155', bd:'#e2e8f0' },
  apple_pay:           { label:'Apple Pay',   bg:'#1e293b', tx:'#f1f5f9', bd:'#334155' },
  recarga_digital:     { label:'App SUBE',    bg:'#ccfbf1', tx:'#0f766e', bd:'#99f6e4' },
  telepase:            { label:'TelePASE',    bg:'#fef3c7', tx:'#92400e', bd:'#fde68a' },
  debito_automatico:   { label:'Déb. Auto.',  bg:'#e0f2fe', tx:'#0369a1', bd:'#bae6fd' },
};
const RUBRO_META = {
  subte:     { label:'Subte',     icon:'', bg:'#dbeafe', tx:'#1d4ed8' },
  colectivo: { label:'Colectivo', icon:'', bg:'#d8eea0', tx:'#44685c' },
  tren:      { label:'Tren',      icon:'', bg:'#ede9fe', tx:'#7c3aed' },
  autopista: { label:'Autopista', icon:'', bg:'#fef3c7', tx:'#92400e' },
  peaje:     { label:'Peaje',     icon:'', bg:'#fee2e2', tx:'#b91c1c' },
};

function TransporteCard({ item, onReport, reported, onDetalle }) {
  const [showAllMetodos, setShowAllMetodos] = useState(false);
  const benefitColor = item.porcentaje_max === 100 ? '#16a34a'
    : item.porcentaje_max >= 50 ? '#44685c'
    : item.porcentaje_max >= 20 ? '#1d4ed8'
    : item.porcentaje_max > 0   ? '#7c3aed'
    : '#b45309';

  const logoMeta = APP_META[item.entidad] || {
    abbr: item.abbr || item.entidad.slice(0,2).toUpperCase(),
    bg:   item.bg   || '#e2e8f0',
    fg:   item.fg   || '#475569',
  };

  const fmtVig = s => {
    if (!s) return '—';
    const [y, m, d] = s.split('-');
    return `${d}/${m}/${y.slice(2)}`;
  };

  const isExpiringSoon = item.fecha_expiracion &&
    new Date(item.fecha_expiracion) <= new Date(Date.now() + 7 * 86400000);

  return (
    <div style={{
      background:'var(--surface)', border:'1px solid var(--border)',
      borderRadius:4, overflow:'hidden',
      borderLeft:`4px solid ${benefitColor}`,
      transition:'box-shadow .15s',
    }}
      onMouseEnter={e => e.currentTarget.style.boxShadow='0 4px 18px var(--shadow-md)'}
      onMouseLeave={e => e.currentTarget.style.boxShadow='none'}
    >
      {/* Header */}
      <div style={{ padding:'14px 16px 10px', display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:10 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{
            width:38, height:38, borderRadius:6, flexShrink:0,
            background:logoMeta.bg, display:'flex', alignItems:'center', justifyContent:'center',
            fontSize:11, fontWeight:900, color:logoMeta.fg, letterSpacing:'-.5px',
            boxShadow:'0 1px 4px rgba(0,0,0,.18)',
          }}>{logoMeta.abbr}</div>
          <div>
            <div style={{ fontWeight:700, fontSize:14, color:'var(--txt-1)', lineHeight:1.2 }}>{item.entidad}</div>
            <div style={{ fontSize:11, color:'var(--txt-3)', marginTop:1 }}>{item.subtitulo}</div>
          </div>
        </div>
        <div style={{ display:'flex', gap:4, flexShrink:0, flexWrap:'wrap', justifyContent:'flex-end' }}>
          {item.promo && (
            <span style={{ fontSize:9, fontWeight:800, padding:'2px 7px', borderRadius:4, background:'#fef3c7', color:'#b45309', border:'1px solid #fde68a', letterSpacing:'.05em' }}>PROMO</span>
          )}
          {item.verificado ? (
            <span style={{ fontSize:9, fontWeight:700, padding:'2px 7px', borderRadius:4, background:'#dcfce7', color:'#16a34a', border:'1px solid #86efac' }}>Verificado</span>
          ) : (
            <span style={{ fontSize:9, fontWeight:700, padding:'2px 7px', borderRadius:4, background:'#fef3c7', color:'#b45309', border:'1px solid #fde68a' }}>Sin verificar</span>
          )}
        </div>
      </div>

      {/* Beneficio principal */}
      <div style={{ padding:'4px 16px 12px', display:'flex', alignItems:'center', gap:16 }}>
        <div style={{ flexShrink:0 }}>
          <div style={{ fontSize:36, fontWeight:900, color:benefitColor, lineHeight:1, letterSpacing:'-1px' }}>
            {item.beneficio_label}
          </div>
          <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.08em', textTransform:'uppercase', marginTop:3 }}>
            {item.tipo_beneficio}
          </div>
        </div>
        {/* Rubros */}
        <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
          {item.rubros.map(r => {
            const rm = RUBRO_META[r] || { label:r, icon:'', bg:'#f1f5f9', tx:'#475569' };
            return (
              <span key={r} style={{ fontSize:11, fontWeight:600, padding:'4px 10px', borderRadius:20, background:rm.bg, color:rm.tx }}>
                {rm.label}
              </span>
            );
          })}
        </div>
      </div>

      {/* Métodos de pago */}
      {(() => {
        const MAX = 3;
        const metodos  = item.metodos_pago || [];
        const visible  = showAllMetodos ? metodos : metodos.slice(0, MAX);
        const hidden   = metodos.length - MAX;
        return (
          <div style={{ padding:'0 16px 12px', display:'flex', flexWrap:'wrap', gap:5, alignItems:'center' }}>
            {visible.map(m => {
              const mm = METODO_META[m] || { label:m, bg:'#f1f5f9', tx:'#475569', bd:'#e2e8f0' };
              return (
                <span key={m} style={{ fontSize:11, fontWeight:700, padding:'4px 11px', borderRadius:4, background:mm.bg, color:mm.tx, border:`1px solid ${mm.bd}` }}>
                  {mm.label}
                </span>
              );
            })}
            {!showAllMetodos && hidden > 0 && (
              <button onClick={() => setShowAllMetodos(true)} style={{
                fontSize:11, fontWeight:700, padding:'4px 10px', borderRadius:4,
                background:'var(--surface-2)', color:'var(--txt-2)', border:'1px solid var(--border)',
                cursor:'pointer', fontFamily:'inherit', transition:'background .12s',
              }}
                onMouseEnter={e => e.currentTarget.style.background='var(--hover-bg)'}
                onMouseLeave={e => e.currentTarget.style.background='var(--surface-2)'}
              >+{hidden} más</button>
            )}
            {showAllMetodos && metodos.length > MAX && (
              <button onClick={() => setShowAllMetodos(false)} style={{
                fontSize:11, fontWeight:700, padding:'4px 10px', borderRadius:4,
                background:'var(--surface-2)', color:'var(--txt-2)', border:'1px solid var(--border)',
                cursor:'pointer', fontFamily:'inherit',
              }}>Ver menos</button>
            )}
          </div>
        );
      })()}

      {/* Condiciones */}
      <div style={{ padding:'10px 16px', background:'var(--surface-2)', borderTop:'1px solid var(--border-lt)' }}>
        <div style={{ fontSize:11, color:'var(--txt-2)', lineHeight:1.65, marginBottom:6 }}>
          {item.condicion}
          {item.segmento && (
            <span style={{ display:'block', color:'#b45309', fontWeight:600, marginTop:3 }}>{item.segmento}</span>

/* ═══════════════════════════════════════
   SECTION BLOCK — expandible con animación
═══════════════════════════════════════ */
function SectionBlock({ sec, secItems, isMobile, t, onSimulate, onNavigate }) {
  const TOP = 5;
  const [expanded,   setExpanded]   = useState(false);
  const [collapsing, setCollapsing] = useState(false);
  const [expandAnim, setExpandAnim] = useState(false);
  const wrapRef       = useRef(null);
  const collapsedHRef = useRef(null);
  const hasMore = secItems.length > TOP;

  /* Medir y guardar la altura colapsada cada vez que estamos en ese estado */
  useEffect(() => {
    if (expanded || collapsing || !hasMore) return;
    const wrap = wrapRef.current;
    if (wrap) collapsedHRef.current = wrap.offsetHeight;
  });

  /* Animar apertura DESPUÉS de que React insertó todas las filas en el DOM */
  useEffect(() => {
    if (!expandAnim) return;
    const wrap = wrapRef.current;
    if (!wrap) { setExpandAnim(false); return; }
    setExpandAnim(false);
    requestAnimationFrame(() => {
      wrap.style.transition = 'max-height 420ms cubic-bezier(.22,.68,0,1.2)';
      wrap.style.maxHeight  = wrap.scrollHeight + 'px';
      setTimeout(() => {
        wrap.style.maxHeight  = '';
        wrap.style.overflow   = '';
        wrap.style.transition = '';
      }, 430);
    });
  }, [expandAnim]);

  const doExpand = () => {
    const wrap = wrapRef.current;
    if (!wrap) { setExpanded(true); return; }
    const fromH = collapsedHRef.current ?? wrap.offsetHeight;
    wrap.style.transition = 'none';
    wrap.style.overflow   = 'hidden';
    wrap.style.maxHeight  = fromH + 'px';
    setExpanded(true);
    setExpandAnim(true);
  };

  const doCollapse = () => {
    const wrap = wrapRef.current;
    if (!wrap) { setExpanded(false); return; }
    const fromH = wrap.offsetHeight;
    const toH   = collapsedHRef.current ?? fromH;
    wrap.style.transition = 'none';
    wrap.style.overflow   = 'hidden';
    wrap.style.maxHeight  = fromH + 'px';
    setCollapsing(true);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      wrap.style.transition = 'max-height 360ms cubic-bezier(.4,0,.2,1)';
      wrap.style.maxHeight  = toH + 'px';
      setTimeout(() => {
        setExpanded(false);
        setCollapsing(false);
        wrap.style.maxHeight  = '';
        wrap.style.overflow   = '';
        wrap.style.transition = '';
      }, 370);
    }));
  };

  const showAll      = expanded || collapsing;
  const visibleItems = hasMore && !showAll ? secItems.slice(0, TOP) : secItems;

  return (
    <div style={{ marginBottom: 20 }}>
      {/* Encabezado */}
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'10px 14px', background: sec.bg,
        borderTop:'1px solid #e2e8f0', borderRight:'1px solid #e2e8f0', borderBottom:'none',
        borderLeft:`3px solid ${sec.color}`,
      }}>
        <div>
          <span style={{ fontWeight:800, fontSize:12, color:sec.color, letterSpacing:'.06em', textTransform:'uppercase' }}>{sec.label}</span>
          <span style={{ fontSize:11, color:'#94a3b8', marginLeft:10 }}>{sec.desc}</span>
        </div>
        <span style={{ fontSize:11, fontWeight:700, color:'#94a3b8' }}>
          {showAll || !hasMore ? secItems.length : TOP}/{secItems.length} apps
        </span>
      </div>

      {/* Tabla */}
      <div ref={wrapRef} style={{ background:'#fff', border:'1px solid #e2e8f0', overflowX:'auto' }}>
        <table style={{ width:'100%', borderCollapse:'collapse' }}>
          <thead>
            <tr style={{ borderBottom:'1px solid var(--border-lt)', background:'var(--surface-3)' }}>
              {[t.colEntidad, !isMobile && t.colProducto, t.colTNA, ''].filter(Boolean).map((col, ci) => (
                <th key={ci} style={{
                  padding: isMobile ? '8px 8px' : '8px 12px',
                  textAlign: (isMobile ? ci===1 : ci===2) ? 'right' : (isMobile ? ci===2 : ci===3) ? 'right' : 'left',
                  fontSize:10, fontWeight:700, color:'#94a3b8',
                  letterSpacing:'.07em', textTransform:'uppercase', whiteSpace:'nowrap',
                }}>{col}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {visibleItems.map((item, idx) => (
              <RankRow key={item.app} item={item} rank={idx+1}
                onSimulate={onSimulate} onHistorial={onNavigate} t={t}
                delay={expanded && !collapsing && idx >= TOP ? `${(idx - TOP) * 0.05}s` : `${idx * 0.04}s`}
                isNew={expanded && !collapsing && idx >= TOP}
                isExiting={false} isMobile={isMobile}
              />
            ))}
          </tbody>
        </table>
      </div>

      {/* Botón Ver más / Ver menos */}
      {hasMore && (
        <button
          onClick={expanded ? doCollapse : doExpand}
          style={{
            width:'100%', padding:'10px 0', cursor:'pointer', fontFamily:'inherit',
            background:'var(--surface)', border:'1px solid #e2e8f0', borderTop:'none',
            color: expanded ? '#94a3b8' : sec.color,
            fontWeight:700, fontSize:12,
            display:'flex', alignItems:'center', justifyContent:'center', gap:6,
            transition:'background .15s, color .15s',
          }}
          onMouseEnter={e => { e.currentTarget.style.background = sec.bg; }}
          onMouseLeave={e => { e.currentTarget.style.background = 'var(--surface)'; }}
        >
          {expanded ? 'Ver menos ↑' : `Ver las ${secItems.length - TOP} apps restantes ↓`}
        </button>
      )}
    </div>
  );
}

                      );
                    };

                    /* ── Vista "Todos" → grid plano de promos ── */
                    if (promotionsCategory === 'all') {
                      return !promotionsLoading && catItems.length > 0 ? (
                        <div style={{ display:'grid', gridTemplateColumns: isMobile?'1fr':'repeat(2,1fr)', gap:14, marginBottom:20 }}>

                        </div>
                      ) : !promotionsLoading && promotionsItems ? (
                        <div style={{ textAlign:'center', padding:'40px 0', color:'var(--txt-3)', fontSize:13 }}>Sin resultados.</div>
                      ) : null;
                    }

                    /* ── Vista por categoría → directorio completo de billeteras ── */
                    const dirWallets = WALLET_DIR[promotionsCategory] || [];
                    const filteredDir = promotionsSearch.trim()
                      ? dirWallets.filter(w => normStr(w.name).includes(normQ) ||
                          allItems.filter(i=>i.wallet===w.key).some(i=>
                            [i.wallet, i.supermarket,...(i.supermarketList||[]),i.description].some(s=>normStr(s).includes(normQ))

                    const catColor = CATS.find(c=>c.key===promotionsCategory)?.color || '#44685c';

                        {filteredDir.map(wallet => {

            {/* ══════════════════════════════════════════
                SECCIÓN TRANSPORTE
            ══════════════════════════════════════════ */}
            {activeTab === 'combustibles' && (() => {
              /* ═══ COMBUSTIBLES ═══════════════════════════════════════ */
              const FUEL_CATS = [
                { key:'all',      label:'Todas',    color:'#44685c' },
                { key:'ypf',      label:'YPF',      color:'#003da5' },
                { key:'shell',    label:'Shell',    color:'#dd1d21' },
                { key:'axion',    label:'Axion',    color:'#cc1e2a' },
                { key:'puma',     label:'Puma',     color:'#e5810f' },
                { key:'gulf',     label:'Gulf',     color:'#c07a10' },
                { key:'bancos',   label:'Bancos',   color:'#1d4ed8' },

                axion: { label:'Axion',      color:'#cc1e2a', bg:'#fff0f0', abbr:'AXN', logoColor:'linear-gradient(135deg,#7f1d1d,#dc2626)'  },

              };
              const FUEL_TYPE_LABEL = {
                NAFTA_SUPER:    'Nafta Super',
                NAFTA_PREMIUM:  'Nafta Premium',
                DIESEL:         'Diesel',
                DIESEL_PREMIUM: 'Diesel Premium',
                GNC:            'GNC',
                CARGA_ELECTRICA:'Carga Eléctrica',
                LUBRICANTES:    'Lubricantes',
                TIENDA:         'Tienda',
                TODOS:          'Todos los productos',
              };
              const TRUST = {
                OFFICIAL:          { label:'Verificado Oficial',        color:'#16a34a', bg:'#dcfce7', bd:'#86efac', dot:'#16a34a' },
                AUTO_VERIFIED:     { label:'Verificado Automáticamente', color:'#1d4ed8', bg:'#dbeafe', bd:'#bfdbfe', dot:'#1d4ed8' },
                SCRAPING_VERIFIED: { label:'Verificado por Scraping',   color:'#b45309', bg:'#fef3c7', bd:'#fde68a', dot:'#b45309' },

              const TODAY    = new Date().getDay();

              const normFuelQ = normFuel(fuelSearch);
              const allFuel  = (fuelItems || []);
              const dateStr  = new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
              const dayName  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][TODAY];
              const fmtEnd   = s => s ? new Date(s).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'}) : '—';

              /* ─── HOY ─── */
              const todayFuel = allFuel
                .filter(i => i.benefitType !== 'LOYALTY' && (!i.validDays || i.validDays.length===7 || i.validDays.includes(TODAY)))
                .sort((a,b) => {
                  const da = (a.discountPercent||0)+(a.cashbackPercent||0);
                  const db = (b.discountPercent||0)+(b.cashbackPercent||0);
                  return db-da || (a.endDate||'9999').localeCompare(b.endDate||'9999');
                });

              /* ─── filtro categoría ─── */
              const MAIN_STATIONS = ['YPF','Shell','Axion','Puma'];
              // Al buscar, ignora el filtro de estación y busca en todo
              let catItems = fuelSearch.trim()
                ? allFuel.filter(i =>
                    [i.station, i.wallet, i.bank, i.retailApp, i.loyaltyProgram, i.description, i.category, ...(i.fuelType||[])]
                      .some(s => normFuel(s).includes(normFuelQ))
                  )
                : (() => {
                    switch (fuelCat) {

                      default:          return allFuel;

                  })();

              /* ─── HOY Card ─── */
              const FuelHoyCard = ({ item }) => {
                const pct = item.discountPercent || item.cashbackPercent || 0;
                const wm  = APP_META[item.wallet] || { abbr:(item.wallet||'?').slice(0,2).toUpperCase(), bg:'#e2e8f0', fg:'#475569' };

              const FuelCard = ({ item }) => {

                        </div>
                        <div style={{ fontSize:10, color:'var(--txt-3)', marginTop:1 }}>
                          <span style={{ fontWeight:700, color:st.color }}>{st.label}</span>
                          {item.retailApp && ` · ${item.retailApp}`}
                        </div>
                      </div>
                      <span style={{ display:'inline-flex', alignItems:'center', gap:4, fontSize:9, fontWeight:700, padding:'2px 7px', borderRadius:4, background:trust.bg, color:trust.color, border:`1px solid ${trust.bd}`, flexShrink:0 }}>
                        <span style={{ width:5, height:5, borderRadius:'50%', background:trust.dot, display:'inline-block' }}/>
                        {trust.label}
                      </span>
                    </div>
                    {/* Porcentaje + detalles */}
                    {item.benefitType !== 'LOYALTY' ? (
                      <div style={{ padding:'4px 14px 8px', display:'flex', alignItems:'center', gap:10 }}>
                        <div style={{ flexShrink:0 }}>
                          <div style={{ fontSize:30, fontWeight:900, color:st.color, lineHeight:1, letterSpacing:'-1px' }}>{pct}%</div>
                          <div style={{ fontSize:9, fontWeight:700, color:'var(--txt-3)', textTransform:'uppercase', letterSpacing:'.07em', marginTop:2 }}>{btm.label}</div>
                        </div>
                        <div style={{ flex:1 }}>
                          <div style={{ display:'flex', flexWrap:'wrap', gap:3, marginBottom:4 }}>
                            {isToday && !allDays && <span style={{ fontSize:9, fontWeight:800, padding:'2px 6px', borderRadius:4, background:'#dcfce7', color:'#16a34a', border:'1px solid #86efac' }}>Hoy</span>}
                            {allDays ? <span style={{ fontSize:9, padding:'2px 6px', borderRadius:4, background:'var(--surface-2)', color:'var(--txt-2)', border:'1px solid var(--border)', fontWeight:600 }}>Todos los días</span>
                              : item.validDays?.map(d=><span key={d} style={{ fontSize:9, padding:'2px 6px', borderRadius:4, background:d===TODAY?'#16a34a':'var(--surface-2)', color:d===TODAY?'#fff':'var(--txt-2)', border:`1px solid ${d===TODAY?'#16a34a':'var(--border)'}`, fontWeight:600 }}>{DIA_ABR[d]}</span>)
                            }
                          </div>
                          <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
                            <span style={{ fontSize:9, fontWeight:700, padding:'2px 7px', borderRadius:4, background:pm.bg, color:pm.tx, border:`1px solid ${pm.bd}` }}>{pm.label}</span>
                            {(item.fuelType||[]).filter(f=>f!=='TODOS').slice(0,2).map(f=>(
                              <span key={f} style={{ fontSize:9, padding:'2px 6px', borderRadius:4, background:st.bg, color:st.color, border:`1px solid ${st.color}22`, fontWeight:600 }}>{FUEL_TYPE_LABEL[f]||f}</span>
                            ))}
                            <span style={{ fontSize:9, padding:'2px 6px', borderRadius:4, background:'var(--surface-2)', color:'var(--txt-3)', border:'1px solid var(--border)' }}>hasta {fmtEnd(item.endDate)}</span>
                          </div>

                      </div>

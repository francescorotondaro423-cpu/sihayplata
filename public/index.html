                  </div>

                  {/* ─── FILTROS ─── */}
                  <div className="nav-scroll" style={{ display:'flex', gap:0, marginBottom:20, borderBottom:'1px solid var(--border)' }}>
                    {MOB_CATS.map(c=>{
                      const on  = movilidadCat === c.key;
                      const cnt = c.key !== 'all' && movilidadItems ? allItems.filter(i=>i.category===c.key).length : null;
                      return (
                        <button key={c.key} onClick={()=>{setMovilidadCat(c.key);setMovilidadSearch('');}}
                          style={{ padding:'11px 18px', cursor:'pointer', fontFamily:'inherit', fontSize:13, fontWeight:on?700:500, background:'none', border:'none', borderBottom:`2px solid ${on?'#44685c':'transparent'}`, marginBottom:-1, color:on?'#44685c':'var(--txt-2)', whiteSpace:'nowrap', transition:'color .15s', display:'flex', alignItems:'center', gap:6 }}
                          onMouseEnter={e=>{if(!on)e.currentTarget.style.color='var(--txt-1)';}}
                          onMouseLeave={e=>{if(!on)e.currentTarget.style.color='var(--txt-2)';}}
                        >
                          {c.label}
                          {cnt !== null && (
                            <span style={{ fontSize:11, fontWeight:600, padding:'1px 7px', borderRadius:10, background:on?'#44685c22':'var(--surface-2)', color:on?'#44685c':'var(--txt-3)' }}>{cnt}</span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {/* ─── LOADING ─── */}
                  {movilidadLoading && (
                    <div style={{ display:'flex', justifyContent:'center', padding:'40px 0', gap:6 }}>
                      {[0,1,2].map(i=><div key={i} style={{ width:7,height:7,borderRadius:'50%',background:'#1d4ed8',animation:`blink 1.2s ease-in-out ${i*.2}s infinite` }}/>)}
                    </div>
                  )}

                  {/* ─── CONTENIDO ─── */}
                  {!movilidadLoading && (() => {
                    if (catItems.length === 0 && movilidadItems) {
                      return <div style={{ textAlign:'center', padding:'40px 0', color:'var(--txt-3)', fontSize:13 }}>Sin resultados.</div>;
                    }

                    if (movilidadCat === 'all') {
                      /* Vista plana */
                      return (
                        <div style={{ display:'grid', gridTemplateColumns:isMobile?'1fr':'repeat(2,1fr)', gap:14, marginBottom:20 }}>
                          {catItems.map(item=><MobCard key={item.id} item={item}/>)}
                        </div>
                      );
                    }

                    /* Vista por categoría — directorio de billeteras */
                    const tr = MOB_TRANSPORT[movilidadCat];
                    const walletKeys = [...new Set(catItems.map(i=>i.wallet))];
                    return (
                      <div style={{ marginBottom:20 }}>
                        <div style={{ fontSize:11, color:'var(--txt-3)', marginBottom:14 }}>
                          {walletKeys.length} fuentes en {tr?.label} · {catItems.length} beneficio{catItems.length!==1?'s':''} verificado{catItems.length!==1?'s':''}
                        </div>
                        {walletKeys.map(wKey => {
                          const wPromos = catItems.filter(i=>i.wallet===wKey);
                          const wm = APP_META[wKey] || { abbr:(wKey||'?').slice(0,2).toUpperCase(), bg:'linear-gradient(135deg,#e2e8f0,#cbd5e1)', fg:'#475569' };
                          const firstItem = wPromos[0];
                          return (
                            <div key={wKey} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:4, marginBottom:12, overflow:'hidden', borderLeft:`4px solid ${tr?.color||'#44685c'}` }}>
                              <div style={{ padding:'12px 16px', display:'flex', alignItems:'center', gap:12 }}>
                                <div style={{ width:40,height:40,borderRadius:8,flexShrink:0,background:wm.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:900,color:wm.fg,letterSpacing:'-.5px',boxShadow:'0 2px 6px rgba(0,0,0,.2)' }}>{wm.abbr}</div>
                                <div style={{ flex:1, minWidth:0 }}>
                                  <div style={{ fontWeight:800, fontSize:14, color:'var(--txt-1)', lineHeight:1.2 }}>{wKey}</div>
                                  {firstItem?.bank && <div style={{ fontSize:10, color:'var(--txt-3)' }}>{firstItem.bank}</div>}
                                </div>
                                <span style={{ fontSize:11, fontWeight:800, padding:'3px 9px', borderRadius:4, background:'#dcfce7', color:'#16a34a', border:'1px solid #86efac', flexShrink:0 }}>
                                  {wPromos.length} beneficio{wPromos.length!==1?'s':''}
                                </span>
                              </div>
                              <div style={{ padding:'0 16px 14px', display:'grid', gridTemplateColumns:(!isMobile&&wPromos.length>1)?'repeat(2,1fr)':'1fr', gap:10 }}>
                                {wPromos.map(item=><MobCard key={item.id} item={item}/>)}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })()}

                  {/* ─── VIAJAR GRATIS ─── */}
                  {movilidadItems && (() => {
                    const gratis = allItems.filter(i => (i.discountPercent||0) >= 100 || (i.cashbackPercent||0) >= 100);
                    if (!gratis.length) return null;
                    return (
                      <div style={{ marginBottom:18 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
                          <div style={{ fontSize:16 }}>🎟️</div>
                          <div>
                            <div style={{ fontSize:13, fontWeight:800, color:'var(--txt-1)' }}>Viajar Gratis</div>
                            <div style={{ fontSize:10, color:'var(--txt-3)' }}>Promociones con reintegro o descuento total — solo nuevos usuarios</div>
                          </div>
                          <span style={{ marginLeft:'auto', fontSize:11, fontWeight:800, padding:'3px 9px', borderRadius:4, background:'#dcfce7', color:'#16a34a', border:'1px solid #86efac' }}>{gratis.length} promos</span>
                        </div>
                        <div style={{ display:'grid', gridTemplateColumns:isMobile?'1fr':'repeat(auto-fill,minmax(200px,1fr))', gap:8 }}>
                          {gratis.map(item => {
                            const pct = (item.discountPercent||0) + (item.cashbackPercent||0);
                            const tr  = MOB_TRANSPORT[item.category] || MOB_TRANSPORT.movilidad_privada;
                            return (
                              <div key={item.id} style={{ background:'linear-gradient(135deg,#16a34a,#15803d)', border:'1px solid #86efac', borderRadius:6, padding:'12px 14px', color:'#fff' }}>
                                <div style={{ fontSize:28, fontWeight:900, letterSpacing:'-2px', lineHeight:1 }}>{pct}%</div>
                                <div style={{ fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'.1em', opacity:.7, marginTop:2 }}>
                                  {item.cashbackPercent>=100?'Cashback':'Descuento'}
                                </div>
                                <div style={{ marginTop:8, fontSize:12, fontWeight:700 }}>{item.wallet}</div>
                                {item.provider && <div style={{ fontSize:10, opacity:.7 }}>en {item.provider}</div>}
                                <div style={{ fontSize:10, opacity:.6, marginTop:4 }}>{tr.label} · {item.capAmount ? `Tope $${item.capAmount.toLocaleString('es-AR')}` : 'Sin tope declarado'}</div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })()}

                  {/* ─── TOP AHORRO ─── */}
                  {movilidadItems && (() => {
                    const SPEND = { subte:60000, trenes:60000, colectivos:60000, telepeajes:16000, estacionamientos:8000, movilidad_privada:30000, micromovilidad:4000 };
                    const byWallet = {};
                    for (const item of allItems) {
                      const pct     = Math.min((item.discountPercent||0)+(item.cashbackPercent||0), 30); // cap para promedio realista
                      const base    = SPEND[item.category] || 0;
                      const savings = Math.round(base * pct / 100);
                      if (!byWallet[item.wallet]) byWallet[item.wallet] = { wallet: item.wallet, savings: 0, bestPct: 0 };
                      byWallet[item.wallet].savings += savings;
                      byWallet[item.wallet].bestPct = Math.max(byWallet[item.wallet].bestPct, (item.discountPercent||0)+(item.cashbackPercent||0));
                    }
                    const top = Object.values(byWallet).sort((a,b)=>b.savings-a.savings).slice(0,6);
                    const maxSavings = top[0]?.savings || 1;
                    return (
                      <div style={{ marginBottom:18 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>

                          {top.map((w, idx) => {

                            const bar = Math.round((w.savings / maxSavings) * 100);
                            return (
                              <div key={w.wallet} style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 14px', borderBottom:idx<top.length-1?'1px solid var(--border-lt)':'' }}>
                                <div style={{ fontSize:11, fontWeight:700, color:'var(--txt-3)', width:14, textAlign:'center' }}>{idx+1}</div>
                                <div style={{ width:28, height:28, borderRadius:4, background:wm.bg, display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, fontWeight:900, color:wm.fg, flexShrink:0 }}>{wm.abbr}</div>
                                <div style={{ flex:1, minWidth:0 }}>
                                  <div style={{ fontSize:12, fontWeight:700, color:'var(--txt-1)' }}>{w.wallet}</div>
                                  <div style={{ marginTop:4, height:4, background:'var(--border)', borderRadius:2, overflow:'hidden' }}>
                                    <div style={{ width:`${bar}%`, height:'100%', background:'#44685c', borderRadius:2, transition:'width .4s' }}/>
                                  </div>
                                </div>
                                <div style={{ textAlign:'right', flexShrink:0 }}>
                                  <div style={{ fontSize:12, fontWeight:800, color:'#44685c' }}>~${w.savings.toLocaleString('es-AR')}</div>
                                  <div style={{ fontSize:11, color:'var(--txt-3)' }}>hasta {w.bestPct}% off</div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                        <div style={{ fontSize:11, color:'var(--txt-3)', marginTop:6, textAlign:'center' }}>
                          Estimación: 40 viajes/mes SUBE · 20 peajes/mes · 10 viajes privados/mes. Referencial.
                        </div>
                      </div>
                    );
                  })()}

                  {/* ─── LEYENDA ─── */}
                  {movilidadItems && (
                    <div style={{ padding:'14px 16px', background:'var(--surface-3)', border:'1px solid var(--border-lt)', borderRadius:4 }}>
                      <div style={{ fontSize:10, fontWeight:700, color:'var(--txt-2)', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:10 }}>Niveles de confianza</div>
                      <div style={{ display:'flex', flexWrap:'wrap', gap:10 }}>
                        {Object.entries(TRUST).map(([k,t])=>(
                          <div key={k} style={{ display:'flex', alignItems:'center', gap:6 }}>
                            <span style={{ width:7,height:7,borderRadius:'50%',background:t.dot,flexShrink:0 }}/>
                            <span style={{ fontSize:10, color:'var(--txt-2)', fontWeight:600 }}>{t.label}</span>
                          </div>
                        ))}
                      </div>
                      <div style={{ fontSize:10, color:'var(--txt-3)', marginTop:8, lineHeight:1.6 }}>
                        Solo se muestran beneficios con <strong style={{ color:'var(--txt-2)' }}>fuente oficial, URL de respaldo y fecha de validación</strong>.
                        {` Actualmente: ${allItems.length} beneficios activos.`}
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}

            {activeTab === 'transporte' && (() => {
              const SECTION_DEFS = [
                { key:'subte',     label:'Subte',     rubros:['subte'],             color:'#1d4ed8', bg:'#eff6ff' },
                { key:'colectivo', label:'Colectivo', rubros:['colectivo'],         color:'#44685c', bg:'#f5feec' },
                { key:'tren',      label:'Tren',      rubros:['tren'],              color:'#7c3aed', bg:'#f5f3ff' },
                { key:'peaje',     label:'Peaje',     rubros:['autopista','peaje'], color:'#0f766e', bg:'#f0fdf9' },
              ];

              const normT = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
              const normTQ = normT(transporteSearch);

              const cardsForSection = sec => {
                const base = (transporteItems || []).filter(i => sec.rubros.some(r => i.rubros.includes(r)));
                if (!transporteSearch.trim()) return base;
                return base.filter(i =>
                  [i.entidad, i.subtitulo, i.condicion, ...(i.rubros||[]), ...(i.metodos_pago||[])]
                    .some(s => normT(s).includes(normTQ))
                );
              };

              // Al buscar, mostrar todas las secciones
              const sectionsToShow = (transporteSearch.trim() || transporteFilter === 'all')
                ? SECTION_DEFS
                : SECTION_DEFS.filter(s => s.key === transporteFilter);


              return (
                <div className="fade-in">
                  {/* Stats rápidas */}
                  <div className="stats-3">
                    {[
                      { label:'Beneficios activos',        val: transporteItems ? transporteItems.length : '—',                                        color:'#44685c' },
                      { label:'100% reintegro / cashback', val: transporteItems ? transporteItems.filter(i=>i.porcentaje_max===100).length : '—',      color:'#16a34a' },
                      { label:'Con tope definido',         val: transporteItems ? transporteItems.filter(i=>i.tope_mensual!=null).length : '—',        color:'#1d4ed8' },
                    ].map(s => (
                      <div key={s.label} style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:4, padding:'12px 14px', borderTop:`3px solid ${s.color}` }}>
                        <div style={{ fontSize:11, fontWeight:700, color:'var(--txt-3)', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:4 }}>{s.label}</div>
                        <div style={{ fontSize:22, fontWeight:900, color:s.color, letterSpacing:'-.5px' }}>{s.val}</div>
                      </div>
                    ))}
                  </div>

                  {/* ─── BUSCADOR ─── */}
                  <div style={{ position:'relative', marginBottom:14 }}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--txt-3)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ position:'absolute', left:14, top:'50%', transform:'translateY(-50%)', pointerEvents:'none' }}>
                      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" placeholder="Buscar entidad, método de pago, tipo de transporte…"
                      value={transporteSearch} onChange={e => setTransporteSearch(e.target.value)}
                      style={{ width:'100%', paddingLeft:42, paddingRight:14, paddingTop:12, paddingBottom:12, background:'var(--input-bg)', border:'1px solid var(--border)', borderRadius:6, fontFamily:'inherit', fontSize:15, color:'var(--txt-1)', outline:'none', boxSizing:'border-box' }}
                    />
                  </div>

                  {/* ─── FILTROS ─── */}
                  <div className="nav-scroll" style={{ display:'flex', gap:0, marginBottom:20, borderBottom:'1px solid var(--border)' }}>
                    {[{ key:'all', label:'Todos' }, ...SECTION_DEFS].map(f => {
                      const on  = transporteFilter === f.key;
                      const cnt = f.key !== 'all' && transporteItems ? (transporteItems || []).filter(i => f.rubros?.some(r => i.rubros.includes(r))).length : null;
                      return (
                        <button key={f.key} onClick={() => setTransporteFilter(f.key)} style={{
                          padding:'11px 18px', cursor:'pointer', fontFamily:'inherit',
                          fontSize:13, fontWeight: on ? 700 : 500,
                          background:'none', border:'none',
                          borderBottom:`2px solid ${on ? '#44685c' : 'transparent'}`,
                          marginBottom:-1, color: on ? '#44685c' : 'var(--txt-2)',
                          whiteSpace:'nowrap', transition:'color .15s',
                          display:'flex', alignItems:'center', gap:6,
                        }}
                          onMouseEnter={e => { if(!on) e.currentTarget.style.color='var(--txt-1)'; }}
                          onMouseLeave={e => { if(!on) e.currentTarget.style.color='var(--txt-2)'; }}
                        >
                          {f.label}
                          {cnt !== null && (
                            <span style={{ fontSize:11, fontWeight:600, padding:'1px 7px', borderRadius:10, background:on?'#44685c22':'var(--surface-2)', color:on?'#44685c':'var(--txt-3)' }}>{cnt}</span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {/* Loading */}
                  {transporteLoading && (
                    <div style={{ display:'flex', justifyContent:'center', padding:'40px 0', gap:6 }}>
                      {[0,1,2].map(i => (
                        <div key={i} style={{ width:7, height:7, borderRadius:'50%', background:'#44685c', animation:`blink 1.2s ease-in-out ${i*.2}s infinite` }} />
                      ))}
                    </div>
                  )}

                  {/* Secciones */}
                  {!transporteLoading && sectionsToShow.map(sec => {
                    const cards = cardsForSection(sec);
                    if (!cards.length) return null;
                    return (
                      <div key={sec.key} style={{ marginBottom:24 }}>
                        <TransporteSectionHeader title={sec.label} count={cards.length} color={sec.color} bg={sec.bg} />
                        <div style={{ display:'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(2,1fr)', gap:14 }}>
                          {cards.map(item => (
                            <TransporteCard
                              key={`${sec.key}-${item.id}`} item={item}
                              onReport={handleReportTransporte}
                              reported={!!transporteReported[item.id]}
                              onDetalle={i => navigate('transporte-detalle', null, i)}
                            />
                          ))}
                        </div>
                      </div>
                    );
                  })}

                  {/* Nota de política de datos */}
                  {transporteItems && (
                    <div style={{ padding:'10px 14px', background:'var(--surface-3)', border:'1px solid var(--border-lt)', borderRadius:4, marginTop:8 }}>
                      <p style={{ color:'#94a3b8', fontSize:11, lineHeight:1.65, margin:0 }}>
                        <strong style={{ color:'#64748b' }}>Política de actualización:</strong> Los beneficios se revisan el 1° de cada mes.
                        Si una promoción cambió antes de su fecha de vencimiento, usá el botón "Reportar cambio" en cada tarjeta.
                        Fuentes: TyC oficiales de cada entidad y gacetillas de prensa a mayo/junio 2026.
                        Esta información es referencial — verificar siempre en la plataforma oficial antes de operar.
                      </p>
                    </div>
                  )}
                </div>
              );
            })()}

            {(activeTab === 'carteras' || activeTab === 'calc') && (() => {
              const label = activeTab === 'calc' ? 'Calculadora de Inversiones' : 'Gestión de Carteras';
              return (
                <div style={{
                  background:'var(--surface)', border:'1px solid var(--border)', borderRadius:2,
                  padding:'48px 24px', textAlign:'center', maxWidth:480, margin:'0 auto',
                }}>
                  <div style={{ fontSize:40, marginBottom:16 }}>🔜</div>
                  <div style={{ fontWeight:800, fontSize:18, color:'var(--txt-1)', marginBottom:8 }}>{label}</div>
                  <div style={{ color:'var(--txt-2)', fontSize:13, marginBottom:24, lineHeight:1.6 }}>
                    Estamos trabajando en esta sección. Te avisamos por email cuando esté lista.
                  </div>
                  {notifySent ? (
                    <div style={{ color:'#44685c', fontWeight:700, fontSize:14 }}>✓ Te avisamos cuando esté disponible</div>
                  ) : (
                    <div style={{ display:'flex', gap:8, maxWidth:320, margin:'0 auto' }}>
                      <input
                        type="email" placeholder="tu@email.com" value={notifyEmail}
                        onChange={e => setNotifyEmail(e.target.value)}
                        style={{
                          flex:1, padding:'10px 14px', border:'1px solid var(--border)',
                          borderRadius:4, fontSize:16, fontFamily:'inherit',
                          background:'var(--input-bg)', color:'var(--txt-1)', outline:'none',
                        }}
                      />
                      <button onClick={() => notifyEmail.includes('@') && setNotifySent(true)} style={{
                        padding:'10px 18px', background:'#44685c', color:'#fff', border:'none',
                        borderRadius:4, cursor:'pointer', fontFamily:'inherit', fontWeight:700, fontSize:13,
                      }}>Avisame</button>
                    </div>
                  )}
                </div>
              );
            })()}

            {/* Disclaimer */}
            <div style={{ marginTop:20, padding:'10px 14px', background:'var(--surface-3)', border:'1px solid var(--border-lt)', borderRadius:2 }}>
              <p style={{ color:'#94a3b8', fontSize:11, lineHeight:1.65, margin:0 }}>{t.disclaimer}</p>
            </div>

          </div>{/* fin col central */}

          {/* ── COL DERECHA: SIDEBAR ── */}
          {!isMobile && (
            BENEFICIOS_KEYS.includes(activeTab)
              ? <BeneficiosSidebar
                  activeTab={activeTab}
                  handleTab={handleTab}
                  promotionsItems={promotionsItems}
                  movilidadItems={movilidadItems}
                  fuelItems={fuelItems}
                  transporteItems={transporteItems}
                />
              : <Sidebar t={t} noticias={noticias} />
          )}

        </div>

      </div>

      {/* ═══════════════════════════════════════════════════
          SECCIÓN EDITORIAL — desktop, tablet y mobile
      ═══════════════════════════════════════════════════ */}
      <NewsEditorialSection
        noticias={noticias}
        noticiasLoad={noticiasLoad}
        dolares={dolares}
        onNavDolar={(key) => {
          handleTab('dolares');
          if (key) { setDolView('detail'); setDolDetail(key); }
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }}
      />

      {/* ═══════════════════════════════════════════════════
          FOOTER
      ═══════════════════════════════════════════════════ */}
      <footer style={{
        borderTop: '1px solid var(--border)',
        marginTop: 32,
        paddingTop: 28,
        paddingBottom: 32,
        background: 'var(--surface)',
      }}>
        <div style={{ maxWidth: 1300, margin: '0 auto', padding: '0 20px' }}>

          {/* ── Links temáticos (solo desktop) ── */}
          {!isMobile && (() => {
            const go = (tab, fil) => {
              setActiveTab(tab);
              if (fil !== undefined) setFilter(fil);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            const links = [
              { label: 'Pesos ARS',            onClick: () => go('ars', 'all') },
              { label: 'Plazo Fijo',            onClick: () => go('ars', 'plazo') },
              { label: 'FCI Money Market',      onClick: () => go('ars', 'fci') },
              { label: 'Billeteras Digitales',  onClick: () => go('ars', 'cuenta') },
              { label: 'Dólar Blue y MEP',      onClick: () => go('dolares', 'all') },
              { label: 'Rendimientos USD',      onClick: () => go('usd', 'all') },
              { label: 'Criptos',               onClick: () => { setActiveTab('criptos'); window.scrollTo({top:0,behavior:'smooth'}); } },
              { label: 'Supermercados',         onClick: () => go('supermercados', 'all') },
              { label: 'Movilidad',             onClick: () => go('movilidad', 'all') },
              { label: 'Combustibles',          onClick: () => go('combustibles', 'all') },
              { label: 'Noticias',              onClick: () => go('noticias', 'all') },
              { label: 'Política de Privacidad',onClick: () => document.getElementById('footer-legal')?.scrollIntoView({ behavior: 'smooth' }) },
            ];
            return (
              <nav style={{ display:'flex', flexWrap:'wrap', justifyContent:'center', gap:'6px 0', marginBottom:20 }}>
                {links.map(({ label, onClick }, i, arr) => (
                  <span key={label} style={{ display:'flex', alignItems:'center' }}>
                    <button onClick={onClick} style={{
                      fontSize: 12, color: 'var(--txt-2)', cursor: 'pointer',
                      padding: '10px 12px', minHeight: 44, background: 'none', border: 'none',
                      fontFamily: 'inherit', transition: 'color .15s',
                    }}
                      onMouseEnter={e => e.currentTarget.style.color='#44685c'}
                      onMouseLeave={e => e.currentTarget.style.color='var(--txt-2)'}
                    >{label}</button>
                    {i < arr.length - 1 && (
                      <span style={{ color: 'var(--border)', fontSize: 14, userSelect: 'none' }}>|</span>
                    )}
                  </span>
                ))}
              </nav>
            );
          })()}

          {/* ── Caja regulatoria / fuente de datos (solo desktop) ── */}
          {!isMobile && <>
          <div style={{
            border: '1px solid var(--border)', borderRadius: 4,
            display: 'flex', flexWrap: 'wrap', alignItems: 'stretch',
            overflow: 'hidden', marginBottom: 20,
          }}>
            {[
              { label: 'Fuente de datos oficial', value: 'BCRA API v4.0', sub: 'Estadísticas Monetarias' },
              { label: 'Indicador de referencia',  value: 'BADLAR',        sub: 'PF entidades financieras privadas' },
              { label: 'Organismo regulador',      value: 'bcra.gob.ar',   sub: 'Banco Central de la República Argentina' },
            ].map((item, i) => (
              <div key={item.label} style={{
                flex: '1 1 180px', textAlign: 'center',
                padding: '16px 20px',
                borderRight: i < 2 ? '1px solid var(--border)' : 'none',
              }}>
                <div style={{ fontSize: 10, fontWeight: 700, color: 'var(--txt-3)', letterSpacing: '.07em', textTransform: 'uppercase', marginBottom: 4 }}>{item.label}</div>
                <div style={{ fontSize: 16, fontWeight: 900, color: 'var(--txt-1)', letterSpacing: '-.3px' }}>{item.value}</div>
                <div style={{ fontSize: 11, color: 'var(--txt-3)', marginTop: 3 }}>{item.sub}</div>
              </div>
            ))}
            <div style={{
              flex: '0 0 auto', display: 'flex', alignItems: 'center', justifyContent: 'center',
              padding: '16px 28px', borderLeft: '1px solid var(--border)',
              gap: 12,
            }}>
              <div style={{
                width: 44, height: 44, borderRadius: '50%',
                background: 'linear-gradient(135deg,#44685c,#2d4a40)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                flexShrink: 0,
              }}>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
              </div>
              <div>
                <div style={{ fontSize: 13, fontWeight: 900, color: 'var(--txt-1)', letterSpacing: '-.2px' }}>BCRA</div>
                <div style={{ fontSize:11, fontWeight: 700, color: 'var(--txt-3)', letterSpacing: '.06em', textTransform: 'uppercase', lineHeight: 1.4 }}>Banco Central<br/>Rep. Argentina</div>
              </div>
            </div>
          </div>

          </>}

          {/* ── Legal disclaimer ── */}
          <p id="footer-legal" style={{ fontSize: 11, color: 'var(--txt-3)', lineHeight: 1.75, marginBottom: isMobile ? 10 : 20, textAlign: 'justify' }}>
            <strong style={{ color: 'var(--txt-2)' }}>SiHayPlata.com</strong> es un sitio meramente informativo y comparativo. No brinda asesoramiento financiero, recomendación de inversión ni invitación a operar. Las tasas y rendimientos publicados son referenciales y pueden cambiar sin previo aviso; corresponde verificarlos directamente en la plataforma oficial de cada entidad antes de tomar decisiones. Los datos de BADLAR y estadísticas monetarias son provistos por la API pública del Banco Central de la República Argentina (BCRA v4.0). Los spreads de cada producto son estimados o informados por las propias entidades y pueden diferir de las condiciones reales vigentes. Los titulares de este sitio no se responsabilizan por inexactitudes, cambios, ni por los eventuales daños patrimoniales que pudieran resultar del uso de la información aquí publicada. Las cotizaciones del dólar son provistas por fuentes de acceso público. Las promociones de supermercados, movilidad y combustibles son referenciales y sujetas a los términos y condiciones de cada entidad emisora.
          </p>

          {/* ── Copyright ── */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, paddingTop: 16, borderTop: '1px solid var(--border-lt)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <img src="/favicon.png" alt="SiHayPlata" style={{ height: 20, width: 'auto', opacity: .7 }} />
              <span style={{ fontSize: 12, color: 'var(--txt-3)' }}>
                © {new Date().getFullYear()} <strong style={{ color: 'var(--txt-2)' }}>SiHayPlata.com</strong> — Todos los derechos reservados
              </span>
            </div>
            <div style={{ display: 'flex', gap: 16 }}>
              {['BCRA API v4.0', 'dolarapi.com', 'La Nación RSS'].map(src => (
                <span key={src} style={{ fontSize: 10, color: 'var(--txt-3)', fontWeight: 600, letterSpacing: '.04em' }}>
                  {src}
                </span>
              ))}
            </div>
          </div>

        </div>
      </footer>

      {/* MODAL */}
      {simItem && (
        <SimModal item={simItem} currency={currency} onClose={() => setSimItem(null)} t={t} />
      )}
      </>)}

      {/* ════════ MOBILE BOTTOM NAV ════════ */}
      <MobileBottomNav
        activeTab={activeTab}
        onTab={key => {
          if (currentPage.page !== 'home') navigate('home');
          // 'beneficios' es meta-tab sin contenido propio:
          // si ya estoy en una sub-sección de beneficios la mantengo, sino voy a supermercados
          const resolved = key === 'beneficios'
            ? (BENEFICIOS_KEYS.includes(activeTab) ? activeTab : 'supermercados')
            : key;
          handleTab(resolved);
          window.scrollTo({ top:0, behavior:'smooth' });
        }}
      />

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

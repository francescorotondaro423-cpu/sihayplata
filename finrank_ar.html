/* ─── API HELPERS ─── */
async function tFetch(url, ms = 7000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch(e) { clearTimeout(t); throw e; }
}

async function apiFetch(url) {
  try { return await tFetch(url, 5000); } catch {}
  try { return await tFetch(`https://corsproxy.io/?${encodeURIComponent(url)}`, 8000); } catch {}
  try { return await tFetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, 8000); } catch {}
  throw new Error(`unreachable: ${url}`);
}

const FMT = d => d.toISOString().slice(0,10);
const TODAY = () => FMT(new Date());
const AGO   = n  => FMT(new Date(Date.now() - n * 86400000));

async function bcraVar(varId) {
  const url = `https://api.bcra.gob.ar/estadisticas/v4.0/monetarias/${varId}?desde=${AGO(20)}&hasta=${TODAY()}`;
  const j = await apiFetch(url);
  const detalle = j?.results?.[0]?.detalle;
  if (!detalle?.length) throw new Error(`BCRA var${varId}: sin datos`);
  return detalle[0].valor;
}

async function fetchDolares() {
  const res = {};
  await Promise.allSettled([
    tFetch('https://dolarapi.com/v1/dolares/blue', 5000).then(d => res.blue = d),
    tFetch('https://dolarapi.com/v1/dolares/bolsa', 5000).then(d => res.mep  = d),
    tFetch('https://dolarapi.com/v1/dolares/contadoconliqui', 5000).then(d => res.ccl  = d),
  ]);
  return res;
}

          <AppLogo app={item.app} size={36} />
          <div>
            <div style={{ display:'flex', alignItems:'center', gap:5, flexWrap:'wrap' }}>
              <span style={{ fontWeight:700, fontSize:14, color:'#0f172a' }}>{item.app}</span>
              {item.promo && (
                <span style={{
                  fontSize:9, padding:'2px 5px', borderRadius:3, fontWeight:800,
                  background:'#fef3c7', border:'1px solid #fde68a', color:'#b45309', letterSpacing:'.05em',
                }}>{t.promo}</span>
              )}
            </div>
            {item.promo && (
              <div style={{ fontSize:11, color:'#94a3b8', marginTop:1 }}>[{t.promo}: {t.promoDays}]</div>
            )}
          </div>
        </div>
      </td>

      {/* Producto */}
      <td style={{ padding:'13px 12px', verticalAlign:'middle' }}>
        <InstTag type={item.type} t={t} />
      </td>

      {/* TNA */}
      <td style={{ padding:'13px 12px', verticalAlign:'middle', textAlign:'right' }}>
        <span style={{ fontWeight:900, fontSize:20, color:'#0f172a' }}>{item.tna.toFixed(1)}%</span>
      </td>

      {/* Límite */}
      <td style={{ padding:'13px 12px', verticalAlign:'middle', color:'#475569', fontSize:13, fontWeight:500 }}>
        {item.limit}
      </td>

      {/* Variación */}
      <td style={{ padding:'13px 12px', verticalAlign:'middle' }}>
        <ChangeIndicator change={item.change} />
      </td>

      {/* Acción */}
      <td style={{ padding:'13px 16px', verticalAlign:'middle' }}>
        <button
          onClick={() => onSimulate(item)}
          style={{
            padding:'6px 12px', borderRadius:6, cursor:'pointer', fontFamily:'inherit',
            background:'#f8fafc', border:'1px solid #e2e8f0',
            color:'#475569', fontWeight:600, fontSize:12, whiteSpace:'nowrap',
          }}
          onMouseEnter={e => e.currentTarget.style.background='#e2e8f0'}
          onMouseLeave={e => e.currentTarget.style.background='#f8fafc'}
        >📊 {t.simBtn}</button>
      </td>
    </tr>
  );
}

/* ─── SIDEBAR ─── */
function Sidebar({ t }) {
  return (
    <div style={{ width:270, flexShrink:0 }}>
      {/* News */}
      <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:10, padding:16, marginBottom:16 }}>
        <div style={{ fontWeight:700, fontSize:14, color:'#0f172a', marginBottom:12, paddingBottom:10, borderBottom:'1px solid #f1f5f9' }}>
          {t.newsTitle}
        </div>
        {NEWS.map((news, i) => (
          <a key={i} href="#" style={{
            display:'block', fontSize:13, color:'#1d4ed8', textDecoration:'none',
            padding:'7px 0', borderBottom: i < NEWS.length-1 ? '1px solid #f1f5f9' : 'none',
            lineHeight:1.4,
          }}
            onMouseEnter={e => e.currentTarget.style.color='#1e40af'}
            onMouseLeave={e => e.currentTarget.style.color='#1d4ed8'}
          >{news}</a>
        ))}
      </div>

      {/* Ad 1 */}
      <div style={{ background:'#f8fafc', border:'1px dashed #e2e8f0', borderRadius:10, padding:16, marginBottom:16, textAlign:'center' }}>
        <div style={{ fontSize:9, color:'#94a3b8', marginBottom:8, letterSpacing:'.06em', textTransform:'uppercase' }}>{t.adLabel}</div>
        <div style={{
          width:'100%', height:250, background:'#f1f5f9', borderRadius:6,
          display:'flex', alignItems:'center', justifyContent:'center',
          color:'#cbd5e1', fontSize:12, fontWeight:600,
        }}>300×250</div>
      </div>

      {/* Ad 2 */}
      <div style={{ background:'#f8fafc', border:'1px dashed #e2e8f0', borderRadius:10, padding:16, textAlign:'center' }}>
        <div style={{ fontSize:9, color:'#94a3b8', marginBottom:8, letterSpacing:'.06em', textTransform:'uppercase' }}>{t.adLabel}</div>
        <div style={{
          width:'100%', height:250, background:'#f1f5f9', borderRadius:6,
          display:'flex', alignItems:'center', justifyContent:'center',
          color:'#cbd5e1', fontSize:12, fontWeight:600,
        }}>300×250</div>
      </div>
    </div>
  );
}

/* ─── MAIN APP ─── */
function App() {
  const [lang,        setLang]        = useState('es');
  const [activeTab,   setActiveTab]   = useState('ars');
  const [filter,      setFilter]      = useState('all');
  const [syncing,     setSyncing]     = useState(false);
  const [initLoading, setInitLoading] = useState(true);
  const [loadMsg,     setLoadMsg]     = useState('Conectando con BCRA…');
  const [lastUpdate,  setLastUpdate]  = useState('—');
  const [animKey,     setAnimKey]     = useState(0);
  const [simItem,     setSimItem]     = useState(null);
  const [arsData,     setArsData]     = useState({ items:[], badlar:null, sourceLabel:'' });
  const [usdData,     setUsdData]     = useState({ items:[], sourceLabel:'' });
  const [dolares,     setDolares]     = useState({ blue:null, mep:null, ccl:null });
  const [fetchError,  setFetchError]  = useState(null);

  const t = T[lang];

  const nowStr = () => {
    const n = new Date();
    return `${n.toLocaleDateString('es-AR')} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')} hs`;
  };

  const fetchAll = useCallback(async (isInit = false) => {
    if (isInit) { setInitLoading(true); setLoadMsg('Conectando con BCRA…'); }
    else setSyncing(true);
    setFetchError(null);
    const [ars, usd, dol] = await Promise.allSettled([loadARS(), loadUSD(), fetchDolares()]);
    if (ars.status === 'fulfilled')  setArsData(ars.value);
    else setFetchError(ars.reason?.message || 'Error BCRA');
    if (usd.status === 'fulfilled')  setUsdData(usd.value);
    if (dol.status === 'fulfilled')  setDolares(dol.value);
    setLastUpdate(nowStr());
    setInitLoading(false);
    setSyncing(false);
  }, []);

  useEffect(() => { fetchAll(true); }, []);

  const currency  = activeTab === 'usd' ? 'USD' : 'ARS';
  const rawData   = currency === 'ARS' ? arsData.items : usdData.items;
  const filters   = currency === 'ARS' ? ARS_FILTERS : USD_FILTERS;
  const filtered  = filter === 'all' ? rawData : rawData.filter(d => d.type === filter);
  const srcLabel  = currency === 'ARS' ? arsData.sourceLabel : usdData.sourceLabel;
  const avgTNA    = arsData.items.length ? (arsData.items.reduce((a,b) => a+b.tna, 0) / arsData.items.length) : 0;
  const avgFiltered = filtered.length ? (filtered.reduce((a,b) => a+b.tna, 0) / filtered.length) : 0;
  const showTable = activeTab === 'ars' || activeTab === 'usd';

  const handleTab = (key) => { setActiveTab(key); setFilter('all'); setAnimKey(k => k+1); };

  const fmtP = n => n != null ? `$${Math.round(n).toLocaleString('es-AR')}` : '—';
  const bl = dolares.blue, mep = dolares.mep, ccl = dolares.ccl;

  if (initLoading) return <LoadingScreen msg={loadMsg} />;

  const TABS = [
    { key:'home',     label:t.tabHome     },
    { key:'ars',      label:t.tabARS      },
    { key:'usd',      label:t.tabUSD      },
    { key:'carteras', label:t.tabCarteras },
    { key:'calc',     label:t.tabCalc     },
  ];

  return (
    <div style={{ minHeight:'100vh', background:'#f1f5f9' }}>

      {/* ── HEADER ── */}
      <header style={{
        background:'#fff', borderBottom:'1px solid #e2e8f0',
        boxShadow:'0 1px 3px rgba(0,0,0,.05)', position:'sticky', top:0, zIndex:40,
      }}>
        <div style={{ maxWidth:1200, margin:'0 auto', padding:'0 20px' }}>

          {/* Lang bar */}
          <div style={{ display:'flex', justifyContent:'flex-end', padding:'5px 0', borderBottom:'1px solid #f1f5f9', gap:4 }}>
            {['es','en'].map(l => (
              <button key={l} onClick={() => setLang(l)} style={{
                background:'none', border:'none', cursor:'pointer', fontFamily:'inherit',
                fontWeight: lang===l ? 700 : 400, color: lang===l ? '#0f172a' : '#94a3b8',
                fontSize:12, padding:'1px 6px',
              }}>{l === 'es' ? 'Spanish' : 'English'}</button>
            ))}
          </div>

          {/* Logo + buttons */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'10px 0' }}>
            <div style={{ display:'flex', alignItems:'center', gap:12 }}>
              <div style={{
                width:44, height:44, borderRadius:10, background:'#16a34a',
                display:'flex', alignItems:'center', justifyContent:'center', fontSize:22,
                boxShadow:'0 2px 8px rgba(22,163,74,.3)',
              }}>📈</div>
              <div>
                <div style={{ fontWeight:900, fontSize:22, color:'#0f172a', lineHeight:1 }}>FinRank AR</div>
                <div style={{ color:'#64748b', fontSize:12, marginTop:2 }}>{t.appSub}</div>
              </div>
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <button style={{
                display:'flex', alignItems:'center', gap:6, padding:'7px 14px', borderRadius:8,
                cursor:'pointer', fontFamily:'inherit', background:'#fff',
                border:'1px solid #e2e8f0', color:'#475569', fontWeight:600, fontSize:13,
              }}>
                <span className="live-dot" style={{ width:7, height:7, borderRadius:'50%', background:'#16a34a', display:'inline-block' }}></span>
                {t.btnUser}
              </button>
              <button style={{
                display:'flex', alignItems:'center', gap:6, padding:'7px 14px', borderRadius:8,
                cursor:'pointer', fontFamily:'inherit', background:'#f1f5f9',
                border:'1px solid #e2e8f0', color:'#475569', fontWeight:600, fontSize:13,
              }}>⚙ {t.btnAdmin}</button>
            </div>
          </div>

          {/* Tabs */}
          <nav style={{ display:'flex', marginBottom:'-1px' }}>
            {TABS.map(tab => {
              const active = activeTab === tab.key;
              return (
                <button key={tab.key} onClick={() => handleTab(tab.key)} style={{
                  padding:'11px 18px', background:'none', border:'none', cursor:'pointer',
                  fontFamily:'inherit', fontWeight: active ? 700 : 500, fontSize:14,
                  color: active ? '#16a34a' : '#64748b',
                  borderBottom: active ? '2px solid #16a34a' : '2px solid transparent',
                  transition:'color .15s, border-color .15s', whiteSpace:'nowrap',
                }}>{tab.label}</button>
              );
            })}
          </nav>
        </div>
      </header>

      {/* ── TICKER ROW ── */}
      <div style={{ background:'#fff', borderBottom:'1px solid #e2e8f0', padding:'12px 0' }}>
        <div style={{ maxWidth:1200, margin:'0 auto', padding:'0 20px' }}>
          <div style={{ display:'flex', gap:10, alignItems:'stretch' }}>
            {/* 2x2 grid */}
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, flex:1 }}>
              <TickerCard
                label={t.dolBlue}
                mainValue={bl ? `${t.compra}: ${fmtP(bl.compra)}, ${t.venta}: ${fmtP(bl.venta)}` : null}
                changeVal={null}
              />
              <TickerCard
                label={t.dolMEP}
                mainValue={mep ? fmtP(mep.venta) : null}
                changeVal={null}
              />
              <TickerCard
                label={t.dolCCL}
                mainValue={ccl ? fmtP(ccl.venta) : null}
                changeVal={null}
              />
              <TickerCard
                label={t.tnaProm}
                mainValue={arsData.items.length ? `${avgTNA.toFixed(1)}%` : null}
                changeVal={null}
              />
            </div>

            {/* Leaderboard ad */}
            <div style={{
              background:'#f8fafc', border:'1px dashed #e2e8f0', borderRadius:10,
              padding:'10px 14px', flexShrink:0,
              display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
              minWidth:200,
            }}>
              <div style={{ fontSize:9, color:'#94a3b8', letterSpacing:'.06em', textTransform:'uppercase', marginBottom:8 }}>Publicidad</div>
              <div style={{
                width:'100%', height:60, background:'#e2e8f0', borderRadius:6,
                display:'flex', alignItems:'center', justifyContent:'center',
                color:'#94a3b8', fontSize:11, fontWeight:600,
              }}>Leaderboard 728×90</div>
            </div>
          </div>
        </div>
      </div>

      {/* ── BODY ── */}
      <div style={{ maxWidth:1200, margin:'20px auto 0', padding:'0 20px 60px' }}>
        <div style={{ display:'flex', gap:20, alignItems:'flex-start' }}>

          {/* MAIN */}
          <div style={{ flex:1, minWidth:0 }}>

            {/* HOME tab */}
            {activeTab === 'home' && (
              <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:10, padding:'40px 24px', textAlign:'center' }}>
                <div style={{ fontSize:48, marginBottom:14 }}>📈</div>
                <div style={{ fontWeight:800, fontSize:22, color:'#0f172a', marginBottom:10 }}>FinRank AR</div>
                <div style={{ color:'#64748b', fontSize:14, maxWidth:420, margin:'0 auto', lineHeight:1.6 }}>
                  Comparador de rendimientos financieros en Argentina.<br/>
                  Seleccioná <strong>Pesos (ARS)</strong> o <strong>Dólares (USD)</strong> para ver el ranking.
                </div>
              </div>
            )}

            {/* ARS / USD TABLE */}
            {showTable && (
              <>
                {/* Data banner */}
                <div style={{
                  background:'#f8fafc', border:'1px solid #e2e8f0', borderRadius:10,
                  padding:'11px 16px', marginBottom:12, fontSize:13, color:'#475569', lineHeight:1.6,
                  display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:8,
                }}>
                  <div>
                    <div className="live-dot" style={{
                      width:7, height:7, borderRadius:'50%', background:'#16a34a',
                      display:'inline-block', marginRight:7, verticalAlign:'middle',
                    }}></div>
                    <strong style={{ color:'#0f172a' }}>{t.dataRealtime}</strong>
                    {' '}({t.lastUpdate}: {lastUpdate}).
                    <br/>
                    <span style={{ color:'#94a3b8', fontSize:11 }}>{t.source}: {srcLabel}.</span>
                    {fetchError && <span style={{ color:'#dc2626', fontSize:11, marginLeft:8 }}>⚠️ {fetchError}</span>}
                  </div>
                  <button
                    onClick={() => fetchAll(false)}
                    disabled={syncing}
                    style={{
                      padding:'6px 14px', borderRadius:7, cursor: syncing ? 'not-allowed' : 'pointer',
                      background: syncing ? '#f1f5f9' : '#16a34a', border:'none',
                      color: syncing ? '#94a3b8' : '#fff', fontWeight:700, fontSize:12, fontFamily:'inherit',
                      display:'flex', alignItems:'center', gap:6,
                    }}
                  >
                    <span className={syncing ? 'spin' : ''}>{syncing ? '⟳' : '↻'}</span>
                    {syncing ? t.syncing : t.syncBtn}
                  </button>
                </div>

                {/* Filter chips */}
                <div style={{ display:'flex', gap:6, marginBottom:12, flexWrap:'wrap' }}>
                  {filters.map(f => (
                    <button key={f.key} onClick={() => setFilter(f.key)} className="filter-chip" style={{
                      padding:'5px 14px', borderRadius:20, cursor:'pointer', fontFamily:'inherit',
                      fontSize:12, fontWeight:600, whiteSpace:'nowrap',
                      background: filter===f.key ? '#16a34a' : '#fff',
                      border:`1px solid ${filter===f.key ? '#16a34a' : '#e2e8f0'}`,
                      color: filter===f.key ? '#fff' : '#64748b',
                    }}>{f.label}</button>
                  ))}
                </div>

                {/* Table */}
                <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:10, overflow:'hidden' }}>
                  {filtered.length === 0 ? (
                    <div style={{ textAlign:'center', color:'#94a3b8', padding:48, fontSize:14 }}>{t.noResults}</div>
                  ) : (
                    <div style={{ overflowX:'auto' }}>
                      <table style={{ width:'100%', borderCollapse:'collapse' }}>
                        <thead>
                          <tr style={{ borderBottom:'2px solid #f1f5f9', background:'#fafafa' }}>
                            {[t.colEntidad, t.colProducto, t.colTNA, t.colLimite, t.colVar, ''].map((col, i) => (
                              <th key={i} style={{
                                padding:'10px 16px', textAlign: i===2 ? 'right' : 'left',
                                fontSize:11, fontWeight:700, color:'#94a3b8',
                                letterSpacing:'.07em', textTransform:'uppercase',
                                ...(i===5 ? { width:90 } : {}),
                              }}>{col}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody key={animKey}>
                          {filtered.map((item, idx) => (
                            <RankRow
                              key={item.id}
                              item={item}
                              rank={idx+1}
                              currency={currency}
                              onSimulate={setSimItem}
                              t={t}
                              delay={`${idx*.05}s`}
                            />
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

              </>
            )}

            {/* COMING SOON tabs */}
            {(activeTab === 'carteras' || activeTab === 'calc') && (
              <div style={{ background:'#fff', border:'1px solid #e2e8f0', borderRadius:10, padding:'48px 24px', textAlign:'center' }}>
                <div style={{ fontSize:32, marginBottom:12 }}>🚧</div>
                <div style={{ fontWeight:700, fontSize:16, color:'#0f172a', marginBottom:6 }}>{t.comingSoon}</div>
                <div style={{ color:'#94a3b8', fontSize:13 }}>Esta sección estará disponible próximamente.</div>
              </div>
            )}

            {/* Disclaimer */}
            <div style={{ marginTop:18, padding:'11px 16px', background:'#fafafa', border:'1px solid #f1f5f9', borderRadius:8 }}>
              <p style={{ color:'#94a3b8', fontSize:11, lineHeight:1.65, margin:0 }}>⚠️ {t.disclaimer}</p>
            </div>
          </div>

          {/* SIDEBAR */}
          <Sidebar t={t} />
        </div>
      </div>

      {simItem && <SimulatorModal item={simItem} currency={currency} onClose={() => setSimItem(null)} t={t} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
